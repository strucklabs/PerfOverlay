<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfOverlay Auswertung</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c232c; --line: #2a323c;
    --text: #e6edf3; --muted: #8b949e; --faint: #4b5563;
    --gpu: #4ade80; --cpu: #fbbf24; --limit: #60a5fa; --mixed: #9ca3af; --bad: #f87171;
    --accent: #4ade80;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --line: #d8dee4;
      --text: #1f2328; --muted: #59636e; --faint: #afb8c1;
      --gpu: #16a34a; --cpu: #d97706; --limit: #2563eb; --mixed: #6b7280; --bad: #dc2626; --accent: #16a34a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header svg { flex: none; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  /* Platz für den späteren Download-Link zum Overlay (ab Release Candidate) */
  header .download { display: none; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }

  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); background: var(--panel); transition: .15s; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  #drop strong { color: var(--text); }
  #drop button { margin-top: 10px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .compact #drop { padding: 12px; text-align: left; display: flex; align-items: center; gap: 12px; }
  .compact #drop p { margin: 0; flex: 1; }
  .compact #drop button { margin: 0; }

  #tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
  .tab { padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tab.active { border-color: var(--accent); background: var(--panel2); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tab .x { color: var(--muted); margin-left: 4px; }
  .tab .x:hover { color: var(--bad); }

  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  section h2 { font-size: 15px; margin: 0 0 12px; font-weight: 600; }
  section h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 18px; }
  .meta b { color: var(--text); font-weight: 500; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .card { background: var(--panel2); border-radius: 8px; padding: 10px 12px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .v small { font-size: 13px; color: var(--muted); font-weight: 400; }

  .sharebar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--panel2); margin: 6px 0 8px; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

  .chart { position: relative; margin-top: 4px; }
  .chart svg.plot { display: block; width: 100%; overflow: visible; }
  .chart .title { font-size: 13px; color: var(--muted); margin: 10px 0 2px; display: flex; gap: 14px; flex-wrap: wrap; }
  .chart .title b { color: var(--text); font-weight: 500; }
  .chart .title .zoom { margin-left: auto; color: var(--limit); cursor: pointer; }
  .chart svg.plot { cursor: crosshair; }
  .swatch-line { display: inline-block; vertical-align: 1px; margin-right: 5px; }
  .swatch { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
  svg text { fill: var(--muted); font-size: 11px; font-family: "Segoe UI", system-ui, sans-serif; }
  .grid line { stroke: var(--line); }
  #tip { position: fixed; pointer-events: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; display: none; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,.3); white-space: nowrap; }
  #tip b { font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td .d { font-size: 12px; margin-left: 6px; }
  .better { color: var(--gpu); } .worse { color: var(--bad); } .same { color: var(--muted); }
  .notes td { text-align: left; }
  .notes td.n { text-align: right; width: 90px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }

  /* Aufklappbare Abschnitte */
  details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--muted); display: inline-block; transition: transform .15s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > summary h2 { margin: 0; }
  details.fold[open] > summary { margin-bottom: 12px; }
  /* Lesehilfe je Abschnitt */
  .help { margin: 0 0 12px; font-size: 13px; color: var(--muted); }
  .help > summary { cursor: pointer; color: var(--limit); width: fit-content; }
  .help > div { margin-top: 6px; line-height: 1.6; border-left: 2px solid var(--line); padding-left: 10px; }
  .help ul { margin: 4px 0; padding-left: 18px; }
  .help p { margin: 4px 0; }
  .gaps { margin: 0 0 12px; padding: 8px 12px; border-radius: 8px; background: var(--bg); border: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
  .gaps p { margin: 2px 0; }
  .gaps b { color: var(--text); font-weight: 500; }
  .help b { color: var(--text); font-weight: 500; }
  /* Einordnung "Auf einen Blick" */
  .insights { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .insights li { display: flex; gap: 10px; align-items: baseline; }
  .insights .i { flex: none; width: 16px; text-align: center; font-weight: 600; }
  .lv-good .i { color: var(--gpu); } .lv-info .i { color: var(--limit); }
  .lv-warn .i { color: var(--cpu); } .lv-bad .i { color: var(--bad); }
  .insights-hint { color: var(--muted); font-size: 13px; margin-top: 10px; }
  @media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } .card .v { font-size: 18px; } }
</style>
</head>
<body>
<header>
  <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="0.5" y="0.5" width="31" height="31" rx="6" fill="#101418" stroke="#374151"/>
    <polyline points="5,21 13,21 16,8 19,21 27,21" fill="none" stroke="#4ade80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="16" cy="8" r="2.6" fill="#fbbf24"/>
  </svg>
  <div>
    <h1>PerfOverlay · Sitzungsauswertung</h1>
    <div class="sub">CSV-Dateien aus „Dokumente\PerfOverlay\Sitzungen“ hineinziehen – alles bleibt auf diesem Rechner.</div>
  </div>
  <div class="spacer"></div>
  <a class="download" href="#">Overlay herunterladen</a>
</header>

<main>
  <div id="drop">
    <p><strong>Sitzungsdateien hierher ziehen</strong> – eine Datei für die Auswertung, mehrere für einen Vergleich (z. B. vor und nach einer Einstellungsänderung).</p>
    <button id="pick">Dateien auswählen …</button>
    <input id="file" type="file" accept=".csv,text/csv" multiple hidden>
  </div>
  <div id="tabs"></div>
  <div id="view"></div>
</main>
<div id="tip"></div>

<script>
"use strict";

const KINDS = {
  Gpu:   { label: "GPU-limitiert", short: "GPU",      color: "var(--gpu)" },
  Cpu:   { label: "CPU-limitiert", short: "CPU",      color: "var(--cpu)" },
  Limit: { label: "FPS-Limit / VSync", short: "Limit", color: "var(--limit)" },
  Mixed: { label: "gemischt", short: "gemischt",      color: "var(--mixed)" },
  None:  { label: "ohne Frame-Daten", short: "–",     color: "var(--faint)" },
};
const SESSION_COLORS = ["#4ade80", "#60a5fa", "#f472b6", "#fbbf24", "#a78bfa", "#2dd4bf"];

const sessions = [];
let active = 0;   // Index der angezeigten Sitzung, -1 = Vergleich

// ---------------------------------------------------------------- Einlesen

const drop = document.getElementById("drop");
const input = document.getElementById("file");
document.getElementById("pick").onclick = () => input.click();
input.onchange = () => loadFiles(input.files);
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => loadFiles(ev.dataTransfer.files));
// Auch außerhalb der Zone fallen lassen, statt dass der Browser die Datei öffnet
window.addEventListener("dragover", ev => ev.preventDefault());
window.addEventListener("drop", ev => { ev.preventDefault(); if (ev.target.closest && !ev.target.closest("#drop")) loadFiles(ev.dataTransfer.files); });

async function loadFiles(files) {
  for (const file of files) {
    try {
      addSession(parseCsv(await file.text(), file.name));
    } catch (e) {
      alert(`${file.name}: ${e.message}`);
    }
  }
  input.value = "";
}

/** Auch für Tests: window.loadCsvText(text, name) */
window.loadCsvText = (text, name) => addSession(parseCsv(text, name));

function addSession(s) {
  s.color = SESSION_COLORS[sessions.length % SESSION_COLORS.length];
  sessions.push(s);
  active = sessions.length >= 2 ? -1 : 0;
  render();
}

function num(v) {
  if (v === undefined || v === "") return null;
  const n = parseFloat(v.replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function parseCsv(text, name) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/);
  const meta = {};
  let header = null;
  const rows = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    if (line.startsWith("#")) {
      const m = line.match(/^#\s*([^:]+):\s*(.*)$/);
      if (m) meta[m[1].trim()] = m[2].trim();
      continue;
    }
    const f = line.split(";");
    if (!header) { header = f; continue; }
    const r = {};
    header.forEach((h, i) => r[h] = f[i] ?? "");
    rows.push(r);
  }
  if (!header || !header.includes("FPS")) throw new Error("keine PerfOverlay-Sitzungsdatei");
  if (rows.length === 0) throw new Error("Sitzung enthält keine Messwerte");

  const col = k => rows.map(r => num(r[k]));
  const d = {
    t: col("Sekunde"), fps: col("FPS"), fpsApp: col("FPS_Spiel"), low1: col("Low1_FPS"),
    ft: col("Frametime_ms"), cpuBusy: col("CPU_Busy_ms"), gpuBusy: col("GPU_Busy_ms"), gpuWait: col("GPU_Wartet_ms"),
    kind: rows.map(r => r.Engpass || "None"), title: rows.map(r => r.Urteil),
    thread: col("Hauptthread_Proz"), cpu: col("CPU_Proz"), pmax: col("PKern_max_Proz"), cpuTemp: col("CPU_Temp"), cpuW: col("CPU_W"),
    gpu: col("GPU_Proz"), gpuTemp: col("GPU_Temp"), gpuW: col("GPU_W"), vram: col("VRAM_GB"), spill: col("VRAM_ausgelagert_GB"),
    gpuMhz: col("GPU_MHz"), gpuV: col("GPU_V"), hotspot: col("GPU_Hotspot"), memTemp: col("GPU_Speicher_Temp"),
    gpuFanPct: col("GPU_Luefter_Proz"), gpuFanRpm: col("GPU_Luefter_U_min"), cpuFanRpm: col("CPU_Luefter_U_min"),
    ram: col("RAM_Proz"), spikes: col("Ruckler"), pacing: col("Pacing_ms"),
    pingRouter: col("Ping_Router_ms"), pingNet: col("Ping_Internet_ms"), jitterNet: col("Jitter_Internet_ms"),
    lossNet: col("Verlust_Internet_Proz"), netDown: col("Netz_Down_MBs"), netUp: col("Netz_Up_MBs"), notes: rows.map(r => r.Meldungen || ""), time: rows.map(r => r.Zeit),
  };
  return { name, meta, rows: rows.length, cols: new Set(header), d, stats: computeStats(d) };
}

// ---------------------------------------------------------------- Kennzahlen

const valid = a => a.filter(v => v !== null);
const avg = a => { const v = valid(a); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
const max = a => { const v = valid(a); return v.length ? Math.max(...v) : null; };
const min = a => { const v = valid(a); return v.length ? Math.min(...v) : null; };

function computeStats(d) {
  const n = d.t.length;
  const duration = n ? (d.t[n - 1] - d.t[0] + 1) : 0;
  const shares = {};
  for (const k of d.kind) shares[k] = (shares[k] || 0) + 1 / n;
  const top = Object.entries(shares).sort((a, b) => b[1] - a[1])[0];
  const spikes = valid(d.spikes).reduce((x, y) => x + y, 0);
  const cpuIdx = d.kind.map((k, i) => k === "Cpu" ? i : -1).filter(i => i >= 0);
  // "unter Last": GPU zu mindestens 90 % ausgelastet – nur dort sind Takt und Spannung vergleichbar
  const loadIdx = d.gpu.map((g, i) => g !== null && g >= 90 ? i : -1).filter(i => i >= 0);

  // Meldungen zusammenfassen: Text ohne wechselnde Zahlen als Schlüssel
  const notes = new Map();
  d.notes.forEach((line, i) => {
    for (const text of line.split(" | ").filter(Boolean)) {
      const key = text.replace(/[\d.,]+/g, "#");
      const e = notes.get(key) || { text, seconds: 0, first: d.t[i] };
      e.seconds++; e.text = text;
      notes.set(key, e);
    }
  });

  return {
    duration, shares, top, spikes,
    spikesPerMin: duration ? spikes / (duration / 60) : 0,
    fps: avg(d.fps), fpsApp: avg(d.fpsApp), low1: avg(d.low1), worstLow1: min(d.low1), ft: avg(d.ft),
    fpsCpu: cpuIdx.length ? avg(cpuIdx.map(i => d.fps[i])) : null,
    cpuBusy: avg(d.cpuBusy), gpuBusy: avg(d.gpuBusy), thread: avg(d.thread),
    cpu: avg(d.cpu), gpu: avg(d.gpu), cpuTempMax: max(d.cpuTemp), gpuTempMax: max(d.gpuTemp),
    cpuW: avg(d.cpuW), gpuW: avg(d.gpuW), vramMax: max(d.vram), spillMax: max(d.spill),
    gpuMhzLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuMhz[i])) : null,
    gpuVLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuV[i])) : null,
    gpuWLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuW[i])) : null,
    hotspotMax: max(d.hotspot), memTempMax: max(d.memTemp),
    cpuFan: avg(d.cpuFanRpm), cpuFanMax: max(d.cpuFanRpm),
    pingNet: avg(d.pingNet), pingNetMax: max(d.pingNet), jitterNet: avg(d.jitterNet),
    lossNet: avg(d.lossNet), lossNetMax: max(d.lossNet), pingRouter: avg(d.pingRouter), netDownMax: max(d.netDown),
    gpuFanLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuFanPct[i])) : null,
    // Pacing nur im Spielgeschehen (ab 40 FPS), Ladebildschirme verzerren sonst den Mittelwert
    pacing: avg(d.pacing.map((p, i) => d.fps[i] !== null && d.fps[i] >= 40 ? p : null)),
    notes: [...notes.values()].sort((a, b) => b.seconds - a.seconds),
  };
}

// ---------------------------------------------------------------- Darstellung

const fmt = (v, dec = 0, unit = "") => v === null || v === undefined ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + unit;
const pct = v => fmt(v * 100, 0, " %");
const clock = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/** "Warframe.x64 · 16.10. 20:10" aus Spielname und Startzeit "2026-10-16 20:10:00" */
const sessionLabel = s => {
  const m = (s.meta["Start"] || "").match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
  return (s.meta["Spiel"] || s.name).replace(/\.exe$/i, "") + (m ? ` · ${m[2]}.${m[1]}. ${m[3]}` : "");
};

function render() {
  document.body.classList.toggle("compact", sessions.length > 0);
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  if (sessions.length >= 2) tabs.append(tab("Vergleich", null, active === -1, () => { active = -1; render(); }));
  sessions.forEach((s, i) => tabs.append(tab(sessionLabel(s), s.color, active === i, () => { active = i; render(); }, () => {
    sessions.splice(i, 1);
    active = sessions.length >= 2 ? -1 : 0;
    render();
  })));

  const view = document.getElementById("view");
  view.innerHTML = "";
  charts.length = 0;
  zoom = null;
  if (!sessions.length) return;
  if (active === -1) renderComparison(view); else renderSession(view, sessions[active]);
}

function tab(text, color, isActive, onClick, onClose) {
  const el = document.createElement("div");
  el.className = "tab" + (isActive ? " active" : "");
  el.innerHTML = (color ? `<span class="dot" style="background:${color}"></span>` : "") + esc(text) + (onClose ? `<span class="x" title="Entfernen">✕</span>` : "");
  el.onclick = ev => { if (ev.target.classList.contains("x")) onClose(); else onClick(); };
  return el;
}

/**
 * Abschnitt; mit opt.id aufklappbar (Zustand bleibt im Browser gespeichert), mit opt.help samt Lesehilfe.
 * Gibt den Inhaltsbereich zurück, in den der Abschnitt seine Inhalte schreibt.
 */
function section(parent, title, sub, opt = {}) {
  const s = document.createElement("section");
  const heading = `<h2>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}</h2>`;
  parent.append(s);
  if (!opt.id) {
    s.innerHTML = heading;
    return s;
  }

  const key = "perfoverlay.fold." + opt.id;
  let open = opt.open ?? false;
  try { const saved = localStorage.getItem(key); if (saved !== null) open = saved === "1"; } catch { /* privates Fenster o. Ä. */ }
  s.innerHTML = `<details class="fold"${open ? " open" : ""}><summary>${heading}</summary><div class="body"></div></details>`;
  const det = s.querySelector("details"), body = s.querySelector(".body");
  if (opt.help) body.insertAdjacentHTML("beforeend", `<details class="help"><summary>So liest du das</summary><div>${opt.help}</div></details>`);
  det.addEventListener("toggle", () => {
    try { localStorage.setItem(key, det.open ? "1" : "0"); } catch { }
    // Diagramme in eingeklappten Abschnitten haben keine Breite – beim Aufklappen neu zeichnen
    if (det.open) charts.filter(c => body.contains(c.wrap)).forEach(draw);
  });
  return body;
}

function shareBar(shares) {
  const order = ["Gpu", "Cpu", "Limit", "Mixed", "None"].filter(k => shares[k] > 0);
  return `<div class="sharebar">${order.map(k => `<div style="width:${shares[k] * 100}%;background:${KINDS[k].color}" title="${KINDS[k].label} ${pct(shares[k])}"></div>`).join("")}</div>
          <div class="legend">${order.map(k => `<span style="--c:${KINDS[k].color}">${KINDS[k].label} <b>${pct(shares[k])}</b></span>`).join("")}</div>`;
}

function renderSession(view, s) {
  const st = s.stats, d = s.d, m = s.meta;

  const head = section(view, m["Spiel"] || s.name, `${m["Start"] || ""} · ${clock(st.duration)} min`);
  head.insertAdjacentHTML("beforeend", `
    <div class="meta">
      ${m["CPU"] ? `<span>CPU <b>${esc(m["CPU"])}</b></span>` : ""}
      ${m["GPU"] ? `<span>GPU <b>${esc(m["GPU"])}</b></span>` : ""}
      ${m["RAM"] ? `<span>RAM <b>${esc(m["RAM"])}</b></span>` : ""}
      ${m["Windows"] ? `<span>Windows <b>${esc(m["Windows"])}</b></span>` : ""}
    </div>`);

  const glance = section(view, "Auf einen Blick", "automatische Einordnung", { id: "glance", open: true, help: HELP.glance });
  glance.insertAdjacentHTML("beforeend", insightList(insightsFor(s), "Regelbasierte Einordnung nach festen Schwellen – ein Hinweis, keine Diagnose."));

  const nt = section(view, "Meldungen", "wie lange sie aktiv waren", { id: "notes", open: true, help: HELP.notes });
  nt.insertAdjacentHTML("beforeend", st.notes.length
    ? `<table class="notes"><tbody>${st.notes.slice(0, 15).map(n => `<tr><td>${esc(n.text)}</td><td class="n">${clock(n.seconds)}</td><td class="n">ab ${clock(n.first - d.t[0])}</td></tr>`).join("")}</tbody></table>`
    : `<p class="empty">Keine Meldungen in dieser Sitzung.</p>`);

  const fg = st.fpsApp && st.fps && st.fpsApp < st.fps * 0.8;
  const sum = section(view, "Zusammenfassung", "", { id: "summary", open: true, help: HELP.summary });
  sum.insertAdjacentHTML("beforeend", `
    <div class="cards">
      ${card("Ø FPS", fmt(st.fps, 0), fg ? `${fmt(st.fpsApp, 0)} vom Spiel` : "")}
      ${card("Ø 1%-Low", fmt(st.low1, 0), `schlechteste Sekunde ${fmt(st.worstLow1, 0)}`)}
      ${card("Ø Frametime", fmt(st.ft, 1), "ms")}
      ${card("Ruckler", fmt(st.spikes, 0), `${fmt(st.spikesPerMin, 1)} pro Minute`)}
      ${card("Frame-Pacing", st.pacing === null ? "–" : "±" + fmt(st.pacing, 1) + " <small>ms</small>",
          st.pacing === null ? "nicht aufgezeichnet" : pacingRating(st.pacing, st.ft))}
      ${card("Hauptengpass", st.top ? KINDS[st.top[0]]?.short ?? st.top[0] : "–", st.top ? pct(st.top[1]) + " der Zeit" : "")}
      ${card("Ø FPS im CPU-Limit", fmt(st.fpsCpu, 0), st.fpsCpu === null ? "kein CPU-Limit" : "hier wirken RAM/CPU")}
      ${card("CPU max", fmt(st.cpuTempMax, 0, " °C"), [
          st.cpuW !== null ? `Ø ${fmt(st.cpuW, 0)} W` : "",
          st.cpuFan !== null ? `Lüfter Ø ${fmt(st.cpuFan, 0)} U/min` : "",
        ].filter(Boolean).join(" · "))}
      ${card("GPU max", fmt(st.gpuTempMax, 0, " °C"), [
          st.hotspotMax !== null ? `Hotspot ${fmt(st.hotspotMax, 0)}` : "",
          st.memTempMax !== null ? `Speicher ${fmt(st.memTempMax, 0)} °C` : "",
        ].filter(Boolean).join(" · ") || (st.gpuW !== null ? `Ø ${fmt(st.gpuW, 0)} W` : ""))}
      ${card("Verbindung", st.pingNet === null ? "–" : fmt(st.pingNet, 0) + " <small>ms</small>", st.pingNet === null
          ? "nicht aufgezeichnet"
          : `±${fmt(st.jitterNet, 0)} ms · Verlust max ${fmt(st.lossNetMax, 0, " %")}`)}
      ${card("GPU unter Last", fmt(st.gpuMhzLoad, 0, " MHz"), [
          st.gpuVLoad !== null ? `${fmt(st.gpuVLoad, 3)} V` : "",
          st.gpuWLoad !== null ? `${fmt(st.gpuWLoad, 0)} W` : "",
          st.gpuFanLoad !== null ? `Lüfter ${fmt(st.gpuFanLoad, 0)} %` : "",
        ].filter(Boolean).join(" · ") || "GPU ≥ 90 % ausgelastet")}
    </div>`);
  if ([st.cpuTempMax, st.gpuTempMax, st.pacing, st.pingNet, st.gpuMhzLoad].includes(null))
    sum.insertAdjacentHTML("beforeend", `<p class="empty">„–“ heißt: nicht aufgezeichnet. Warum, steht im jeweiligen Abschnitt weiter unten.</p>`);

  const has = key => d[key].some(v => v !== null);
  /** Diagramm nur mit Linien, für die es Werte gibt – ganz ohne Werte entfällt es (der Grund steht im Hinweis darüber) */
  const plot = (parent, title, series, opt) => { const x = series.filter(x => has(x.key)); if (x.length) chart(parent, s, title, x, opt); };

  const bn = section(view, "Engpass", "was die Bildrate begrenzt", { id: "bottleneck", help: HELP.bottleneck });
  gapNote(bn, s, ["cpuBusy", "gpuBusy", "thread"]);
  bn.insertAdjacentHTML("beforeend", shareBar(st.shares));
  plot(bn, "Arbeitszeit pro Frame (ms) – der höhere Wert bremst", [
    { key: "cpuBusy", label: "CPU", color: "var(--cpu)" },
    { key: "gpuBusy", label: "GPU", color: "var(--gpu)" },
    { key: "ft", label: "Frametime", color: "var(--muted)", dash: "3 3" },
  ], { min: 0, unit: " ms" });
  plot(bn, "Auslastung (%)", [
    { key: "gpu", label: "GPU", color: "var(--gpu)" },
    { key: "thread", label: "Hauptthread", color: "var(--cpu)" },
    { key: "cpu", label: "CPU gesamt", color: "var(--limit)" },
  ], { min: 0, max: 100, unit: " %" });

  const img = section(view, "Bild und Ruckler", "Mauszeiger für Einzelwerte, Bereich ziehen zum Vergrößern", { id: "frames", help: HELP.frames });
  gapNote(img, s, ["pacing"]);
  plot(img, "Bilder pro Sekunde", [
    { key: "fps", label: "FPS", color: s.color },
    { key: "low1", label: "1%-Low", color: "var(--muted)", dash: "3 3" },
  ], { min: 0, markers: true, strip: true });

  const cpu = section(view, "Prozessor", "", { id: "cpu", help: HELP.cpu });
  gapNote(cpu, s, ["cpuTemp", "cpuW", "cpuFanRpm"]);
  plot(cpu, "CPU-Temperatur (°C)", [{ key: "cpuTemp", label: "CPU", color: "var(--cpu)" }], { unit: " °C" });
  plot(cpu, "CPU-Lüfter (U/min)", [{ key: "cpuFanRpm", label: "CPU-Lüfter", color: "var(--cpu)" }], { min: 0, unit: " U/min" });

  const gpu = section(view, "Grafikkarte", "", { id: "gpu", help: HELP.gpu });
  gapNote(gpu, s, ["gpuTemp", "gpuMhz", "gpuW", "gpuV", "hotspot", "memTemp", "gpuFanRpm"]);
  plot(gpu, "GPU-Temperaturen (°C)", [
    { key: "gpuTemp", label: "GPU", color: "var(--gpu)" },
    { key: "hotspot", label: "Hotspot", color: "var(--gpu)", dash: "4 3" },
    { key: "memTemp", label: "Speicher", color: "var(--bad)", dash: "2 2" },
  ], { unit: " °C" });
  plot(gpu, "GPU-Takt (MHz)", [{ key: "gpuMhz", label: "Takt", color: "var(--gpu)" }], { unit: " MHz" });
  plot(gpu, "GPU-Spannung (V)", [{ key: "gpuV", label: "Spannung", color: "var(--limit)" }], { unit: " V" });
  plot(gpu, "GPU-Lüfter (U/min)", [{ key: "gpuFanRpm", label: "GPU-Lüfter", color: "var(--gpu)" }], { min: 0, unit: " U/min" });

  const net = section(view, "Verbindung", "Ping zu Router und Internet", { id: "network", help: HELP.network });
  gapNote(net, s, ["pingNet"]);
  plot(net, "Ping (ms)", [
    { key: "pingNet", label: "Internet", color: "var(--limit)" },
    { key: "pingRouter", label: "Router", color: "var(--muted)", dash: "3 3" },
  ], { min: 0, unit: " ms" });

}

// ---------------------------------------------------------------- Fehlende Daten

/** Messwert → Anzeigename, CSV-Spalte und Datenquelle. Je nach PC liefert nicht jede Quelle etwas. */
const FIELDS = {
  cpuTemp: ["CPU-Temperatur", "CPU_Temp", "hwinfo"],
  cpuW: ["CPU-Leistung", "CPU_W", "hwinfo"],
  cpuFanRpm: ["CPU-Lüfter", "CPU_Luefter_U_min", "cpuFan"],
  gpuTemp: ["GPU-Temperatur", "GPU_Temp", "nvml"],
  gpuMhz: ["GPU-Takt", "GPU_MHz", "nvml"],
  gpuW: ["GPU-Leistung", "GPU_W", "nvml"],
  gpuV: ["GPU-Spannung", "GPU_V", "hwinfo"],
  hotspot: ["Hotspot", "GPU_Hotspot", "hwinfo"],
  memTemp: ["Speichertemperatur", "GPU_Speicher_Temp", "memSensor"],
  gpuFanRpm: ["GPU-Lüfter", "GPU_Luefter_U_min", "hwinfo"],
  cpuBusy: ["CPU-Arbeitszeit", "CPU_Busy_ms", "frames"],
  gpuBusy: ["GPU-Arbeitszeit", "GPU_Busy_ms", "frames"],
  thread: ["Hauptthread", "Hauptthread_Proz", "process"],
  pacing: ["Frame-Pacing", "Pacing_ms", "frames"],
  pingNet: ["Ping", "Ping_Internet_ms", "ping"],
};

const GAP_REASONS = {
  old: "Diese Aufzeichnung stammt aus einer älteren Version von PerfOverlay, die diese Werte noch nicht erfasst hat.",
  hwinfo: "HWiNFO lief während der Aufzeichnung nicht oder ohne „Shared Memory Support“ (HWiNFO → Einstellungen). "
    + "In der kostenlosen Version muss die Option alle 12 Stunden neu eingeschaltet werden.",
  cpuFan: "HWiNFO meldet für dieses Mainboard keinen Lüfter mit „CPU“ im Namen – z. B. weil der Kühler an einem anderen Anschluss hängt.",
  nvml: "Diese Werte liest PerfOverlay direkt nur bei NVIDIA- und AMD-Grafikkarten aus. Bei anderen Grafikkarten (z. B. Intel Arc) fehlen sie.",
  memSensor: "Nicht jede Grafikkarte hat einen Temperatursensor für den Grafikspeicher.",
  frames: "Die Bildmessung hat dazu keine Werte geliefert.",
  process: "Das Spiel ließ sich nicht genauer auslesen, z. B. wegen eines Anti-Cheat-Schutzes.",
  ping: "Die Ping-Messung war ausgeschaltet (Einstellung „PingTarget“ leer) oder es bestand keine Verbindung.",
};

/** Schreibt einen Hinweis in den Abschnitt, welche der Werte fehlen und warum – gruppiert nach Grund. */
function gapNote(parent, s, keys) {
  const has = key => s.d[key].some(v => v !== null);
  const groups = new Map();
  for (const key of keys) {
    if (has(key)) continue;
    const [label, column, source] = FIELDS[key];
    let reason = source;
    if (!s.cols.has(column)) reason = "old";
    // Fehlt HWiNFO ganz, ist das der eigentliche Grund – nicht der fehlende Lüfter oder Sensor
    else if ((source === "cpuFan" && !has("cpuTemp")) || (source === "memSensor" && !has("hotspot"))) reason = "hwinfo";
    groups.set(reason, [...(groups.get(reason) || []), label]);
  }
  if (!groups.size) return;
  parent.insertAdjacentHTML("beforeend", `<div class="gaps">${[...groups].map(([reason, labels]) =>
    `<p><b>Nicht aufgezeichnet: ${esc(labels.join(", "))}.</b> ${esc(GAP_REASONS[reason])}</p>`).join("")}</div>`);
}

// ---------------------------------------------------------------- Einordnung

const LEVEL_ICON = { bad: "!", warn: "▲", info: "i", good: "✓" };
const LEVEL_ORDER = { bad: 0, warn: 1, info: 2, good: 3 };

/** Anteil der Sitzung (0–1), in der eine Meldung aktiv war, deren Text auf das Muster passt */
function noteShare(st, pattern) {
  if (!st.duration) return 0;
  return st.notes.filter(n => pattern.test(n.text)).reduce((sum, n) => sum + n.seconds, 0) / st.duration;
}

/**
 * Kernaussagen zu einer Sitzung – feste Regeln mit denselben Schwellen wie im Overlay, keine Statistik-Magie.
 * Formulierungen bewusst vorsichtig ("deutet auf"), denn Messwerte allein kennen die Ursache nicht immer.
 */
function insightsFor(s) {
  const st = s.stats, out = [];
  const add = (level, text) => out.push({ level, text });

  // Gleichmäßigkeit: 1%-Low im Verhältnis zur Ø-FPS – wichtiger fürs Spielgefühl als die Ø-FPS selbst
  if (st.fps && st.low1) {
    const r = st.low1 / st.fps;
    if (r >= 0.8) add("good", `Gleichmäßige Bildausgabe: das 1%-Low liegt bei ${pct(r)} der Ø-FPS.`);
    else if (r >= 0.65) add("info", `Leichte Schwankungen: das 1%-Low liegt bei ${pct(r)} der Ø-FPS.`);
    else add("warn", `Ungleichmäßige Bildausgabe: das 1%-Low liegt nur bei ${pct(r)} der Ø-FPS – Details unter „Bild und Ruckler“.`);
  }

  if (st.spikesPerMin > 10) add("warn", `Häufige Ruckler: ${fmt(st.spikesPerMin, 1)} pro Minute – die Meldungen nennen die vermutete Ursache.`);
  else if (st.spikesPerMin > 2) add("info", `Gelegentliche Ruckler: ${fmt(st.spikesPerMin, 1)} pro Minute.`);
  else if (st.duration) add("good", `Kaum Ruckler: ${fmt(st.spikesPerMin, 1)} pro Minute.`);

  if (st.pacing !== null && pacingRating(st.pacing, st.ft) === "unruhig")
    add("warn", `Unruhiges Frame-Pacing (±${fmt(st.pacing, 1)} ms von Bild zu Bild) – FPS-Limit, VSync und G-Sync/FreeSync prüfen.`);

  // Engpass
  const sh = st.shares;
  if ((sh.Cpu || 0) >= 0.3) add("warn", `Häufig CPU-limitiert (${pct(sh.Cpu)} der Zeit): Grafikeinstellungen senken bringt hier wenig, CPU, RAM und Hintergrundprogramme bremsen.`);
  else if ((sh.Gpu || 0) >= 0.6) add("info", `Überwiegend GPU-limitiert (${pct(sh.Gpu)} der Zeit) – der Normalfall; mehr FPS gibt es über die Grafikeinstellungen.`);
  else if ((sh.Limit || 0) >= 0.5) add("good", `Überwiegend im FPS-Limit (${pct(sh.Limit)} der Zeit) – das System hat Reserven.`);

  // Kühlung
  const gpuThrottle = noteShare(st, /GPU drosselt wegen Temperatur/);
  if (gpuThrottle >= 0.1) add("warn", `Die Grafikkarte drosselt wegen Temperatur (${pct(gpuThrottle)} der Zeit) – Kühlung, Staub und Lüfterkurve prüfen.`);
  else if (st.gpuTempMax !== null && st.gpuTempMax >= 83) add("info", `Die Grafikkarte wird bis ${fmt(st.gpuTempMax, 0)} °C warm – nahe an der üblichen Drosselgrenze.`);

  const cpuThrottle = noteShare(st, /CPU drosselt/);
  if (st.cpuTempMax !== null && st.cpuTempMax >= 95) add("bad", `Die CPU erreicht ${fmt(st.cpuTempMax, 0)} °C – nahe an ihrer Maximaltemperatur; Kühler und Wärmeleitpaste prüfen.`);
  else if (cpuThrottle >= 0.05) add("warn", `Die CPU wird zeitweise gedrosselt (${pct(cpuThrottle)} der Zeit) – Grund steht in den Meldungen.`);

  if (st.memTempMax !== null && st.memTempMax >= 100) add("warn", `Der Grafikspeicher erreicht ${fmt(st.memTempMax, 0)} °C – deutet auf gealterte Wärmeleitpads oder wenig Luftstrom hin.`);
  if (noteShare(st, /VRAM voll/) > 0) add("warn", "Der Grafikspeicher lief voll – Texturdetails oder Auflösung senken.");
  if (st.fpsApp && st.fps && st.fpsApp < st.fps * 0.8) add("info", `Frame Generation war aktiv: ${fmt(st.fps, 0)} FPS angezeigt, ${fmt(st.fpsApp, 0)} vom Spiel gerendert.`);

  // Verbindung
  if (st.pingNet !== null) {
    if ((st.lossNetMax || 0) >= 3 || (st.jitterNet || 0) >= 15)
      add("warn", `Die Verbindung schwankte (Ping ${fmt(st.pingNet, 0)} ms ±${fmt(st.jitterNet, 0)}, Verlust bis ${fmt(st.lossNetMax, 0)} %) – Details unter „Verbindung“.`);
    else add("good", `Stabile Verbindung: ${fmt(st.pingNet, 0)} ms ±${fmt(st.jitterNet, 0)}, kein nennenswerter Verlust.`);
  }

  if (!out.some(x => x.level === "warn" || x.level === "bad")) add("good", "Keine Auffälligkeiten bei Kühlung und Engpässen.");
  return out.sort((a, b) => LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level]);
}

function insightList(items, hint) {
  return `<ul class="insights">${items.map(x => `<li class="lv-${x.level}"><span class="i">${LEVEL_ICON[x.level]}</span><span>${esc(x.text)}</span></li>`).join("")}</ul>`
    + (hint ? `<p class="insights-hint">${esc(hint)}</p>` : "");
}

/** Lesehilfen je Abschnitt – allgemein formuliert, gelten für jedes System. */

    Abweichungen unter 2 % sind normale Messschwankungen.`,
};

/** Wie FrameMetrics.PacingRating im Overlay: unter 10 % der Frametime ruhig, ab 25 % unruhig */
function pacingRating(pacing, ft) {
  if (pacing === null || !ft) return "";
  if (pacing < 1) return "ruhig";   // unter 1 ms nicht wahrnehmbar (Menüs mit sehr hohen FPS)
  const r = pacing / ft;
  return r < 0.10 ? "ruhig" : r < 0.25 ? "leicht unruhig" : "unruhig";
}

function card(k, v, sub) {
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="k">${sub || "&nbsp;"}</div></div>`;
}

// ---------------------------------------------------------------- Vergleich

const METRICS = [
  ["Dauer", s => s.duration, v => clock(v), 0],
  ["Ø FPS", s => s.fps, v => fmt(v, 1), 1],
  ["Ø 1%-Low", s => s.low1, v => fmt(v, 1), 1],
  ["Ø FPS im CPU-Limit", s => s.fpsCpu, v => fmt(v, 1), 1],
  ["Ø Frametime", s => s.ft, v => fmt(v, 2, " ms"), -1],
  ["Ruckler pro Minute", s => s.spikesPerMin, v => fmt(v, 1), -1],
  ["Ø Frame-Pacing", s => s.pacing, v => "±" + fmt(v, 2, " ms"), -1],
  ["Anteil GPU-Limit", s => s.shares.Gpu || 0, pct, 0],
  ["Anteil CPU-Limit", s => s.shares.Cpu || 0, pct, -1],
  ["Ø CPU-Arbeitszeit", s => s.cpuBusy, v => fmt(v, 2, " ms"), -1],
  ["Ø GPU-Arbeitszeit", s => s.gpuBusy, v => fmt(v, 2, " ms"), 0],
  ["Ø Hauptthread", s => s.thread, v => fmt(v, 0, " %"), 0],
  ["CPU-Temperatur max", s => s.cpuTempMax, v => fmt(v, 0, " °C"), -1],
  ["GPU-Temperatur max", s => s.gpuTempMax, v => fmt(v, 0, " °C"), -1],
  ["GPU-Hotspot max", s => s.hotspotMax, v => fmt(v, 0, " °C"), -1],
  ["GPU-Speicher max", s => s.memTempMax, v => fmt(v, 0, " °C"), -1],
  ["Ø GPU-Takt unter Last", s => s.gpuMhzLoad, v => fmt(v, 0, " MHz"), 1],
  ["Ø GPU-Spannung unter Last", s => s.gpuVLoad, v => fmt(v, 3, " V"), 0],
  ["Ø GPU-Leistung unter Last", s => s.gpuWLoad, v => fmt(v, 0, " W"), 0],
  ["Ø Ping Internet", s => s.pingNet, v => fmt(v, 0, " ms"), -1],
  ["Ø Jitter Internet", s => s.jitterNet, v => "±" + fmt(v, 1, " ms"), -1],
  ["Paketverlust max", s => s.lossNetMax, v => fmt(v, 0, " %"), -1],
  ["Ø CPU-Lüfter", s => s.cpuFan, v => fmt(v, 0, " U/min"), -1],
  ["Ø GPU-Lüfter unter Last", s => s.gpuFanLoad, v => fmt(v, 0, " %"), -1],
  ["Ø CPU-Leistung", s => s.cpuW, v => fmt(v, 0, " W"), 0],
  ["Ø GPU-Leistung", s => s.gpuW, v => fmt(v, 0, " W"), 0],
];

/** Einordnung jeder weiteren Sitzung gegenüber der ersten: Bildrate, Gleichmäßigkeit, Ruckler, Temperaturen */
function comparisonInsights() {
  const ref = sessions[0], r = ref.stats, out = [];
  const game = s => (s.meta["Spiel"] || s.name).toLowerCase();
  if (sessions.some(s => game(s) !== game(ref)))
    out.push({ level: "warn", text: "Die Sitzungen stammen aus verschiedenen Spielen – die Zahlen lassen sich nicht direkt vergleichen." });

  const rel = (a, b) => (a !== null && b) ? (a - b) / Math.abs(b) * 100 : null;
  for (const s of sessions.slice(1)) {
    const st = s.stats, parts = [];
    let score = 0;
    const judge = (label, p, higherIsBetter, unit = " %") => {
      if (p === null || Math.abs(p) < 2) return;
      const better = (p > 0) === higherIsBetter;
      score += better ? 1 : -1;
      parts.push(`${label} ${p > 0 ? "+" : ""}${fmt(p, 0)}${unit}`);
    };
    judge("Ø FPS", rel(st.fps, r.fps), true);
    judge("1%-Low", rel(st.low1, r.low1), true);
    if (r.spikesPerMin + st.spikesPerMin >= 1) judge("Ruckler", rel(st.spikesPerMin, Math.max(r.spikesPerMin, 0.1)), false);

    const dT = (a, b) => (a !== null && b !== null) ? a - b : null;
    for (const [label, d] of [["GPU", dT(st.gpuTempMax, r.gpuTempMax)], ["GPU-Speicher", dT(st.memTempMax, r.memTempMax)], ["CPU", dT(st.cpuTempMax, r.cpuTempMax)]]) {
      if (d === null || Math.abs(d) < 3) continue;
      score += d < 0 ? 1 : -1;
      parts.push(`${label} ${d > 0 ? "+" : "−"}${fmt(Math.abs(d), 0)} °C`);
    }

    const verdict = !parts.length ? "praktisch gleich (Abweichungen unter Messrauschen)"
      : score > 0 ? "insgesamt besser" : score < 0 ? "insgesamt schlechter" : "gemischt";
    out.push({
      level: !parts.length ? "info" : score > 0 ? "good" : score < 0 ? "warn" : "info",
      text: `${sessionLabel(s)}: ${verdict}${parts.length ? " – " + parts.join(", ") : ""}.`,
    });
  }
  return out;
}

function renderComparison(view) {
  const ref = sessions[0];
  const glance = section(view, "Auf einen Blick", `gegenüber ${sessionLabel(ref)}`, { id: "cmp-glance", open: true, help: HELP.glance });
  glance.insertAdjacentHTML("beforeend", insightList(comparisonInsights(),
    "Verglichen werden Bildrate, Gleichmäßigkeit, Ruckler und Höchsttemperaturen; unter 2 % bzw. 3 °C gilt als gleich."));

  const sec = section(view, "Vergleich", `Referenz: ${sessionLabel(ref)} – Abweichungen in % zur Referenz`, { id: "cmp-table", open: true, help: HELP.compare });
  const head = sessions.map(s => `<th><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:6px"></span>${esc(sessionLabel(s))}</th>`).join("");
  const body = METRICS.map(([label, get, show, dir]) => {
    const base = get(ref.stats);
    return `<tr><td>${label}</td>${sessions.map((s, i) => {
      const v = get(s.stats);
      let delta = "";
      if (i > 0 && v !== null && base) {
        const p = (v - base) / Math.abs(base) * 100;
        const cls = Math.abs(p) < 2 || dir === 0 ? "same" : (p > 0) === (dir > 0) ? "better" : "worse";
        delta = `<span class="d ${cls}">${p > 0 ? "+" : ""}${fmt(p, 1)} %</span>`;
      }
      return `<td>${v === null ? "–" : show(v)}${delta}</td>`;
    }).join("")}</tr>`;
  }).join("");
  sec.insertAdjacentHTML("beforeend", `<table><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table>`);

  const bn = section(view, "Engpass je Sitzung", "", { id: "cmp-bottleneck", open: true, help: HELP.bottleneck });
  sessions.forEach(s => bn.insertAdjacentHTML("beforeend", `<div style="margin-top:8px;font-size:13px"><span class="swatch" style="background:${s.color}"></span>${esc(sessionLabel(s))}</div>${shareBar(s.stats.shares)}`));

  const ch = section(view, "FPS im Vergleich", "Zeitachse ab Sitzungsbeginn", { id: "cmp-fps", open: true, help: HELP.frames });
  compareChart(ch);
}

// ---------------------------------------------------------------- Diagramme (SVG, ohne Bibliothek)

const charts = [];

/** Legendenlinie im selben Strichmuster wie die Kurve im Diagramm */
function swatch(x) {
  return `<svg class="swatch-line" width="16" height="6" aria-hidden="true"><line x1="0" x2="16" y1="3" y2="3" stroke="${x.color}" stroke-width="2"${x.dash ? ` stroke-dasharray="${x.dash}"` : ""}/></svg>`;
}
const H = 150, PAD = { l: 38, r: 8, t: 8, b: 20 };

function chart(parent, s, title, series, opt = {}) {
  const wrap = document.createElement("div");
  wrap.className = "chart";
  wrap.innerHTML = `<div class="title"><b>${title}</b>${series.map(x => `<span>${swatch(x)}${x.label}</span>`).join("")}</div>`;
  parent.append(wrap);
  const c = { wrap, sessions: [s], series, opt, single: true };
  charts.push(c);
  draw(c);
}

function compareChart(parent) {
  const wrap = document.createElement("div");
  wrap.className = "chart";
  wrap.innerHTML = `<div class="title">${sessions.map(s => `<span><span class="swatch" style="background:${s.color}"></span>${esc(sessionLabel(s))}</span>`).join("")}</div>`;
  parent.append(wrap);
  const c = { wrap, sessions: [...sessions], series: [{ key: "fps", label: "FPS" }], opt: { min: 0 }, single: false };
  charts.push(c);
  draw(c);
}

/** Sichtbarer Zeitausschnitt in Sekunden ab Sitzungsbeginn – gilt für alle Diagramme der Ansicht; null = gesamte Sitzung */
let zoom = null;
let drag = null;   // laufende Auswahl: { c, x0 }

function setZoom(z) {
  zoom = z;
  charts.forEach(draw);
}

function draw(c) {
  c.wrap.querySelector("svg.plot")?.remove();
  const W = Math.max(300, c.wrap.clientWidth);
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b - (c.opt.strip ? 8 : 0);

  let tMax = 0;
  for (const s of c.sessions) tMax = Math.max(tMax, s.d.t[s.d.t.length - 1] - s.d.t[0]);
  tMax = Math.max(tMax, 1);
  const ta = zoom ? Math.min(zoom.a, tMax) : 0;
  const span = Math.max(1, (zoom ? Math.min(zoom.b, tMax) : tMax) - ta);
  const inRange = t => t >= ta && t <= ta + span;
  const X = t => PAD.l + (t - ta) / span * iw;

  // Sichtbare Punkte je Sitzung und Linie: [t, v]
  const visible = (s, key) => {
    const t0 = s.d.t[0], out = [];
    s.d[key].forEach((v, i) => { const t = s.d.t[i] - t0; if (v !== null && inRange(t)) out.push([t, v]); });
    return out;
  };

  // Wertebereich über alle sichtbaren Werte. Oben zählt das 99. Perzentil: Einzelne Ausreißer (z. B. ein
  // 90-ms-Frame beim Laden) würden sonst den ganzen Verlauf flach an den Boden drücken – sie werden abgeschnitten.
  let lo = c.opt.min ?? Infinity, hi = c.opt.max ?? -Infinity;
  const all = [];
  for (const s of c.sessions) for (const x of c.series) for (const [, v] of visible(s, x.key)) {
    if (c.opt.min === undefined) lo = Math.min(lo, v);
    all.push(v);
  }
  if (c.opt.max === undefined && all.length) {
    all.sort((a, b) => a - b);
    hi = all[Math.min(all.length - 1, Math.floor(all.length * 0.99))];
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi)) { lo = 0; hi = 1; }
  if (c.opt.min === undefined) lo = Math.floor(lo * 0.9);
  if (c.opt.max === undefined) hi = niceMax(hi * 1.05);
  if (hi <= lo) hi = lo + 1;

  const Y = v => PAD.t + ih - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * ih;
  let svg = `<svg class="plot" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;

  // Raster und Beschriftung
  svg += `<g class="grid">`;
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    svg += `<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y}" y2="${y}"/><text x="${PAD.l - 6}" y="${y + 4}" text-anchor="end">${fmt(v, hi - lo < 10 ? 1 : 0)}</text>`;
  }
  for (let i = 0; i <= 5; i++) {
    const t = ta + span * i / 5;
    svg += `<text x="${X(t)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === 5 ? "end" : "middle"}">${clock(t)}</text>`;
  }
  svg += `</g>`;

  // Engpass-Streifen unter dem Diagramm – bei mehr Messpunkten als Pixeln je Pixel der häufigste Engpass
  if (c.opt.strip) {
    const s = c.sessions[0], t0 = s.d.t[0], y = PAD.t + ih + 3;
    const idx = s.d.t.map((t, i) => i).filter(i => inRange(s.d.t[i] - t0));
    if (idx.length <= iw) {
      for (const i of idx) {
        const x1 = X(s.d.t[i] - t0), x2 = Math.min(PAD.l + iw, X(s.d.t[i] - t0 + 1));
        svg += `<rect x="${x1}" y="${y}" width="${Math.max(0.6, x2 - x1)}" height="5" fill="${(KINDS[s.d.kind[i]] || KINDS.None).color}"/>`;
      }
    } else {
      const px = new Map();
      for (const i of idx) {
        const p = Math.min(iw - 1, Math.floor(X(s.d.t[i] - t0) - PAD.l));
        const counts = px.get(p) || {};
        counts[s.d.kind[i]] = (counts[s.d.kind[i]] || 0) + 1;
        px.set(p, counts);
      }
      for (const [p, counts] of px) {
        const k = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
        svg += `<rect x="${PAD.l + p}" y="${y}" width="1" height="5" fill="${(KINDS[k] || KINDS.None).color}"/>`;
      }
    }
  }

  // Ruckler als rote Markierungen
  if (c.opt.markers) {
    const s = c.sessions[0], t0 = s.d.t[0];
    s.d.spikes.forEach((n, i) => {
      const t = s.d.t[i] - t0;
      if (n > 0 && inRange(t)) svg += `<line x1="${X(t)}" x2="${X(t)}" y1="${PAD.t}" y2="${PAD.t + ih}" stroke="var(--bad)" stroke-opacity=".45"/>`;
    });
  }

  // Linien – Lücken (Pause, Alt+Tab) über 3 s werden nicht verbunden. Liegen mehr Messpunkte als Pixel im
  // Ausschnitt (lange Sitzungen), wird je Pixelspalte zusammengefasst: Mittelwert als Linie, Minimum bis
  // Maximum als blasses Band – sonst springt die Linie innerhalb einer Spalte hin und her und wird zur Fläche.
  for (const s of c.sessions) {
    for (const x of c.series) {
      const color = c.single ? x.color : s.color;
      const pts = visible(s, x.key);
      const style = `fill="none" stroke="${color}" stroke-width="1.5" ${x.dash ? `stroke-dasharray="${x.dash}"` : ""} stroke-linejoin="round"`;
      if (pts.length <= iw * 1.5) {
        let d = "", prevT = null;
        for (const [t, v] of pts) {
          d += (prevT === null || t - prevT > 3 ? "M" : "L") + X(t).toFixed(1) + "," + Y(v).toFixed(1);
          prevT = t;
        }
        svg += `<path d="${d}" ${style}/>`;
        continue;
      }

      const buckets = [];
      for (const [t, v] of pts) {
        const p = Math.min(iw - 1, Math.floor(X(t) - PAD.l));
        const b = buckets[buckets.length - 1];
        if (b && b.p === p) { b.sum += v; b.n++; b.min = Math.min(b.min, v); b.max = Math.max(b.max, v); b.t1 = t; }
        else buckets.push({ p, sum: v, n: 1, min: v, max: v, t0: t, t1: t });
      }
      // Zusammenhängende Abschnitte (ohne Lücke über 3 s)
      const segments = [];
      for (const b of buckets) {
        const seg = segments[segments.length - 1], prev = seg?.[seg.length - 1];
        if (!prev || b.t0 - prev.t1 > 3) segments.push([b]); else seg.push(b);
      }
      const bx = b => (PAD.l + b.p + 0.5).toFixed(1);
      let band = "", line = "";
      for (const seg of segments) {
        band += "M" + seg.map(b => bx(b) + "," + Y(b.max).toFixed(1)).join("L")
          + "L" + seg.slice().reverse().map(b => bx(b) + "," + Y(b.min).toFixed(1)).join("L") + "Z";
        line += "M" + seg.map(b => bx(b) + "," + Y(b.sum / b.n).toFixed(1)).join("L");
      }
      // Gestrichelte Hilfslinien (Frametime, 1%-Low …) ohne Band – das würde sonst unübersichtlich
      if (!x.dash) svg += `<path d="${band}" fill="${color}" fill-opacity=".16" stroke="none"/>`;
      svg += `<path d="${line}" ${style}/>`;
    }
  }
  svg += `<rect class="sel" x="0" y="${PAD.t}" width="0" height="${ih}" fill="var(--limit)" fill-opacity=".18" visibility="hidden"/>`;
  svg += `<line class="cross" x1="0" x2="0" y1="${PAD.t}" y2="${PAD.t + ih}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/>`;
  svg += `<rect x="${PAD.l}" y="${PAD.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  c.wrap.insertAdjacentHTML("beforeend", svg);

  // Hinweis auf den Ausschnitt in der Titelzeile
  const title = c.wrap.querySelector(".title");
  let info = title.querySelector(".zoom");
  if (!info) {
    info = document.createElement("span");
    info.className = "zoom";
    info.onclick = () => setZoom(null);
    title.append(info);
  }
  info.style.display = zoom ? "" : "none";
  info.textContent = zoom ? `Ausschnitt ${clock(ta)}–${clock(ta + span)} · Gesamt anzeigen` : "";

  const el = c.wrap.querySelector("svg.plot");
  Object.assign(c, { X, ta, span, iw });
  el.onmousemove = ev => { hover(c, ev); if (drag?.c === c) showSelection(c, ev); };
  el.onmouseleave = () => { document.getElementById("tip").style.display = "none"; charts.forEach(k => k.wrap.querySelector(".cross")?.setAttribute("visibility", "hidden")); };
  el.onmousedown = ev => {
    if (ev.button !== 0) return;
    ev.preventDefault();   // keine Textmarkierung beim Ziehen
    drag = { c, x0: svgX(el, ev) };
  };
  el.ondblclick = () => setZoom(null);
}

const svgX = (el, ev) => ev.clientX - el.getBoundingClientRect().left;
const timeAt = (c, x) => c.ta + Math.min(1, Math.max(0, (x - PAD.l) / c.iw)) * c.span;

function showSelection(c, ev) {
  const el = c.wrap.querySelector("svg.plot"), sel = el.querySelector(".sel");
  const clamp = x => Math.min(PAD.l + c.iw, Math.max(PAD.l, x));
  const a = clamp(drag.x0), b = clamp(svgX(el, ev));
  sel.setAttribute("x", Math.min(a, b));
  sel.setAttribute("width", Math.abs(b - a));
  sel.setAttribute("visibility", "visible");
}

// Auswahl beenden – auch wenn die Maus beim Loslassen außerhalb des Diagramms ist
document.addEventListener("mouseup", ev => {
  if (!drag) return;
  const { c, x0 } = drag;
  drag = null;
  const el = c.wrap.querySelector("svg.plot");
  el.querySelector(".sel")?.setAttribute("visibility", "hidden");
  const x1 = svgX(el, ev);
  if (Math.abs(x1 - x0) < 6) return;   // einfacher Klick, kein Ziehen
  let a = timeAt(c, Math.min(x0, x1)), b = timeAt(c, Math.max(x0, x1));
  if (b - a < 10) { const m = (a + b) / 2; a = Math.max(0, m - 5); b = a + 10; }   // mindestens 10 s
  setZoom({ a, b });
});

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(f => f * p).find(f => f >= v);
}

/** Fadenkreuz in allen Diagrammen synchron, Werte im Tooltip */
function hover(c, ev) {
  const t = timeAt(c, svgX(ev.currentTarget, ev));
  for (const k of charts) {
    const cross = k.wrap.querySelector(".cross");
    if (!cross) continue;
    const inside = t >= k.ta && t <= k.ta + k.span;
    const x = k.X(t);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", inside ? "visible" : "hidden");
  }
  let html = `<b>${clock(t)}</b>`;
  for (const s of c.sessions) {
    const t0 = s.d.t[0];
    let i = 0, best = Infinity;
    s.d.t.forEach((v, j) => { const dist = Math.abs(v - t0 - t); if (dist < best) { best = dist; i = j; } });
    if (best > 2) continue;
    if (c.single) {
      html += c.series.map(x => `<br>${swatch(x)}${x.label}: ${fmt(s.d[x.key][i], 1)}${c.opt.unit || ""}`).join("");
      html += `<br><span style="color:var(--muted)">${esc(s.d.title[i] || "")}</span>`;
    } else {
      html += `<br><span class="swatch" style="background:${s.color}"></span>${esc(sessionLabel(s))}: ${fmt(s.d.fps[i], 0)} FPS`;
    }
  }
  const tip = document.getElementById("tip");
  tip.innerHTML = html;
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - tw - 8, ev.clientX + 14) + "px";
  tip.style.top = (ev.clientY + 14) + "px";
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => charts.forEach(draw), 120); });
</script>
</body>
</html>
