<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PerfOverlay Auswertung</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c232c; --line: #2a323c;
    --text: #e6edf3; --muted: #8b949e; --faint: #4b5563;
    --gpu: #4ade80; --cpu: #fbbf24; --limit: #60a5fa; --mixed: #9ca3af; --bad: #f87171;
    --accent: #4ade80;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f8fa; --panel: #ffffff; --panel2: #f0f3f6; --line: #d8dee4;
      --text: #1f2328; --muted: #59636e; --faint: #afb8c1;
      --gpu: #16a34a; --cpu: #d97706; --limit: #2563eb; --mixed: #6b7280; --bad: #dc2626; --accent: #16a34a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.55 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header svg { flex: none; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  /* Platz für den späteren Download-Link zum Overlay (ab Release Candidate) */
  header .download { display: none; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }

  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 28px; text-align: center; color: var(--muted); background: var(--panel); transition: .15s; }
  #drop.over { border-color: var(--accent); color: var(--text); }
  #drop strong { color: var(--text); }
  #drop button { margin-top: 10px; }
  button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .compact #drop { padding: 12px; text-align: left; display: flex; align-items: center; gap: 12px; }
  .compact #drop p { margin: 0; flex: 1; }
  .compact #drop button { margin: 0; }

  #tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 20px; }
  .tab { padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  .tab.active { border-color: var(--accent); background: var(--panel2); }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; }
  .tab .x { color: var(--muted); margin-left: 4px; }
  .tab .x:hover { color: var(--bad); }

  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 20px 24px; margin-bottom: 22px; }
  section h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; }
  section h2 small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 22px; }
  .meta b { color: var(--text); font-weight: 500; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin: 4px 0 8px; }
  .card { background: var(--panel2); border-radius: 8px; padding: 12px 16px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .card .v small { font-size: 13px; color: var(--muted); font-weight: 400; }

  .sharebar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--panel2); margin: 10px 0 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 13px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; background: var(--c); vertical-align: -1px; }

  .chart { position: relative; margin-top: 10px; }
  .chart svg.plot { display: block; width: 100%; overflow: visible; }
  .chart .title { font-size: 13px; color: var(--muted); margin: 18px 0 6px; display: flex; gap: 16px; flex-wrap: wrap; }
  .chart .title b { color: var(--text); font-weight: 500; }
  .chart .title .zoom { margin-left: auto; color: var(--limit); cursor: pointer; }
  .chart svg.plot { cursor: crosshair; }
  .swatch-line { display: inline-block; vertical-align: 1px; margin-right: 5px; }
  .swatch { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
  svg text { fill: var(--muted); font-size: 11px; font-family: "Segoe UI", system-ui, sans-serif; }
  .grid line { stroke: var(--line); }
  #tip { position: fixed; pointer-events: none; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; font-size: 12px; display: none; z-index: 10; box-shadow: 0 4px 14px rgba(0,0,0,.3); white-space: nowrap; }
  #tip b { font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td .d { font-size: 12px; margin-left: 6px; }
  .better { color: var(--gpu); } .worse { color: var(--bad); } .same { color: var(--muted); }
  .notes td { text-align: left; }
  .notes td.n { text-align: right; width: 90px; color: var(--muted); }
  .empty { color: var(--muted); font-size: 13px; }

  /* Aufklappbare Abschnitte */
  details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--muted); display: inline-block; transition: transform .15s; }
  details.fold[open] > summary::before { transform: rotate(90deg); }
  details.fold > summary h2 { margin: 0; }
  details.fold[open] > summary { margin-bottom: 16px; }
  /* Lesehilfe je Abschnitt */
  .help { margin: 0 0 16px; font-size: 13px; color: var(--muted); }
  .help > summary { cursor: pointer; color: var(--limit); width: fit-content; }
  .help > div { margin-top: 8px; line-height: 1.65; border-left: 2px solid var(--line); padding-left: 12px; }
  .help ul { margin: 6px 0; padding-left: 18px; }
  .help li { margin: 4px 0; }
  .help p { margin: 4px 0; }
  .gaps { margin: 0 0 16px; padding: 10px 14px; border-radius: 8px; background: var(--bg); border: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
  .gaps p { margin: 2px 0; }
  .gaps b { color: var(--text); font-weight: 500; }
  .help b { color: var(--text); font-weight: 500; }
  /* Einordnung "Auf einen Blick" */
  .insights { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .insights li { display: flex; gap: 12px; align-items: flex-start; line-height: 1.5; }
  .ico { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
         border-radius: 50%; border: 1.5px solid currentColor; font-size: 12px; font-weight: 700; line-height: 1;
         font-family: "Segoe UI", system-ui, sans-serif; margin-top: 1px; }
  .lv-good .ico { color: var(--gpu); } .lv-info .ico { color: var(--limit); }
  .lv-warn .ico { color: var(--cpu); } .lv-bad .ico { color: var(--bg); background: var(--bad); border-color: var(--bad); }
  .legend-ico { display: inline-flex; align-items: center; gap: 6px; margin-right: 14px; }
  .legend-ico .ico { width: 17px; height: 17px; font-size: 10.5px; margin: 0; }
  .result-section { border-color: color-mix(in srgb, var(--limit) 35%, var(--line)); }
  .result { border-left: 4px solid var(--c); padding: 6px 0 6px 14px; margin: 6px 0 16px; }
  .result .r-title { font-size: 22px; font-weight: 600; color: var(--c); }
  .result .r-sub { color: var(--muted); margin-top: 4px; }
  .evidence { font-size: 13px; color: var(--muted); margin: 16px 0; line-height: 1.7; }
  .evidence b { color: var(--text); font-weight: 500; }
  .tips { background: var(--panel2); border-radius: 8px; padding: 14px 18px; margin: 16px 0 8px; font-size: 14px; }
  .tips ul { margin: 8px 0 0; padding-left: 20px; }
  .tips li { margin: 6px 0; }
  .side-head { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 22px 0 12px; }
  .insights-hint { color: var(--muted); font-size: 13px; margin-top: 18px; }
  @media (max-width: 640px) { header, main { padding-left: 16px; padding-right: 16px; } .card .v { font-size: 18px; } }
</style>
</head>
<body>
<header>
  <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true">
    <rect x="0.5" y="0.5" width="31" height="31" rx="6" fill="#101418" stroke="#374151"/>
    <polyline points="5,21 13,21 16,8 19,21 27,21" fill="none" stroke="#4ade80" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="16" cy="8" r="2.6" fill="#fbbf24"/>
  </svg>
  <div>
    <h1>PerfOverlay · Sitzungsauswertung</h1>
    <div class="sub">CSV-Dateien aus „Dokumente\PerfOverlay\Sitzungen“ hineinziehen – alles bleibt auf diesem Rechner.</div>
  </div>
  <div class="spacer"></div>
  <a class="download" href="#">Overlay herunterladen</a>
</header>

<main>
  <div id="drop">
    <p><strong>Sitzungsdateien hierher ziehen</strong> – eine Datei für die Auswertung, mehrere für einen Vergleich (z. B. vor und nach einer Einstellungsänderung).</p>
    <button id="pick">Dateien auswählen …</button>
    <input id="file" type="file" accept=".csv,text/csv" multiple hidden>
  </div>
  <div id="tabs"></div>
  <div id="view"></div>
</main>
<div id="tip"></div>

<script>
"use strict";

const KINDS = {
  Gpu:   { label: "GPU-limitiert", short: "GPU",      color: "var(--gpu)" },
  Cpu:   { label: "CPU-limitiert", short: "CPU",      color: "var(--cpu)" },
  Limit: { label: "FPS-Limit / VSync", short: "Limit", color: "var(--limit)" },
  Mixed: { label: "gemischt", short: "gemischt",      color: "var(--mixed)" },
  None:  { label: "ohne Frame-Daten", short: "–",     color: "var(--faint)" },
};
const SESSION_COLORS = ["#4ade80", "#60a5fa", "#f472b6", "#fbbf24", "#a78bfa", "#2dd4bf"];

const sessions = [];
let active = 0;   // Index der angezeigten Sitzung, -1 = Vergleich

// ---------------------------------------------------------------- Einlesen

const drop = document.getElementById("drop");
const input = document.getElementById("file");
document.getElementById("pick").onclick = () => input.click();
input.onchange = () => loadFiles(input.files);
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => loadFiles(ev.dataTransfer.files));
// Auch außerhalb der Zone fallen lassen, statt dass der Browser die Datei öffnet
window.addEventListener("dragover", ev => ev.preventDefault());
window.addEventListener("drop", ev => { ev.preventDefault(); if (ev.target.closest && !ev.target.closest("#drop")) loadFiles(ev.dataTransfer.files); });

async function loadFiles(files) {
  for (const file of files) {
    try {
      addSession(parseCsv(await file.text(), file.name));
    } catch (e) {
      alert(`${file.name}: ${e.message}`);
    }
  }
  input.value = "";
}

/** Auch für Tests: window.loadCsvText(text, name) */
window.loadCsvText = (text, name) => addSession(parseCsv(text, name));

function addSession(s) {
  s.color = SESSION_COLORS[sessions.length % SESSION_COLORS.length];
  sessions.push(s);
  active = sessions.length >= 2 ? -1 : 0;
  render();
}

function num(v) {
  if (v === undefined || v === "") return null;
  const n = parseFloat(v.replace(",", "."));
  return Number.isFinite(n) ? n : null;
}

function parseCsv(text, name) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/);
  const meta = {};
  let header = null;
  const rows = [];
  for (const line of lines) {
    if (!line.trim()) continue;
    if (line.startsWith("#")) {
      const m = line.match(/^#\s*([^:]+):\s*(.*)$/);
      if (m) meta[m[1].trim()] = m[2].trim();
      continue;
    }
    const f = line.split(";");
    if (!header) { header = f; continue; }
    const r = {};
    header.forEach((h, i) => r[h] = f[i] ?? "");
    rows.push(r);
  }
  if (!header || !header.includes("FPS")) throw new Error("keine PerfOverlay-Sitzungsdatei");
  if (rows.length === 0) throw new Error("Sitzung enthält keine Messwerte");

  const col = k => rows.map(r => num(r[k]));
  const d = {
    t: col("Sekunde"), fps: col("FPS"), fpsApp: col("FPS_Spiel"), low1: col("Low1_FPS"),
    ft: col("Frametime_ms"), cpuBusy: col("CPU_Busy_ms"), gpuBusy: col("GPU_Busy_ms"), gpuWait: col("GPU_Wartet_ms"),
    kind: rows.map(r => r.Engpass || "None"), title: rows.map(r => r.Urteil),
    thread: col("Hauptthread_Proz"), cpu: col("CPU_Proz"), pmax: col("PKern_max_Proz"), cpuTemp: col("CPU_Temp"), cpuW: col("CPU_W"),
    gpu: col("GPU_Proz"), gpuTemp: col("GPU_Temp"), gpuW: col("GPU_W"), vram: col("VRAM_GB"), spill: col("VRAM_ausgelagert_GB"),
    gpuMhz: col("GPU_MHz"), gpuV: col("GPU_V"), hotspot: col("GPU_Hotspot"), memTemp: col("GPU_Speicher_Temp"),
    gpuFanPct: col("GPU_Luefter_Proz"), gpuFanRpm: col("GPU_Luefter_U_min"), cpuFanRpm: col("CPU_Luefter_U_min"),
    ram: col("RAM_Proz"), spikes: col("Ruckler"), pacing: col("Pacing_ms"),
    pingRouter: col("Ping_Router_ms"), pingNet: col("Ping_Internet_ms"), jitterNet: col("Jitter_Internet_ms"),
    lossNet: col("Verlust_Internet_Proz"), netDown: col("Netz_Down_MBs"), netUp: col("Netz_Up_MBs"),
    conns: col("Verbindungen"), dead: col("Tote_Verbindungen"),
    dpc: col("DPC_max_Proz"), commit: col("Commit_Proz"), gameRam: col("Spiel_RAM_GB"), notes: rows.map(r => r.Meldungen || ""), time: rows.map(r => r.Zeit),
  };
  return { name, meta, rows: rows.length, cols: new Set(header), d, stats: computeStats(d) };
}

// ---------------------------------------------------------------- Kennzahlen

const valid = a => a.filter(v => v !== null);
const avg = a => { const v = valid(a); return v.length ? v.reduce((x, y) => x + y, 0) / v.length : null; };
const max = a => { const v = valid(a); return v.length ? Math.max(...v) : null; };
const min = a => { const v = valid(a); return v.length ? Math.min(...v) : null; };

function computeStats(d) {
  const n = d.t.length;
  const duration = n ? (d.t[n - 1] - d.t[0] + 1) : 0;
  const shares = {};
  for (const k of d.kind) shares[k] = (shares[k] || 0) + 1 / n;
  const top = Object.entries(shares).sort((a, b) => b[1] - a[1])[0];
  const spikes = valid(d.spikes).reduce((x, y) => x + y, 0);
  const cpuIdx = d.kind.map((k, i) => k === "Cpu" ? i : -1).filter(i => i >= 0);
  // "unter Last": GPU zu mindestens 90 % ausgelastet – nur dort sind Takt und Spannung vergleichbar
  const loadIdx = d.gpu.map((g, i) => g !== null && g >= 90 ? i : -1).filter(i => i >= 0);

  // Meldungen zusammenfassen: Text ohne wechselnde Zahlen als Schlüssel
  const notes = new Map();
  d.notes.forEach((line, i) => {
    for (const text of line.split(" | ").filter(Boolean)) {
      const key = text.replace(/[\d.,]+/g, "#");
      const e = notes.get(key) || { text, seconds: 0, first: d.t[i] };
      e.seconds++; e.text = text;
      notes.set(key, e);
    }
  });

  return {
    duration, shares, top, spikes,
    spikesPerMin: duration ? spikes / (duration / 60) : 0,
    fps: avg(d.fps), fpsApp: avg(d.fpsApp), low1: avg(d.low1), worstLow1: min(d.low1), ft: avg(d.ft),
    fpsCpu: cpuIdx.length ? avg(cpuIdx.map(i => d.fps[i])) : null,
    cpuBusy: avg(d.cpuBusy), gpuBusy: avg(d.gpuBusy), gpuWait: avg(d.gpuWait), thread: avg(d.thread),
    cpu: avg(d.cpu), gpu: avg(d.gpu), cpuTempMax: max(d.cpuTemp), gpuTempMax: max(d.gpuTemp),
    cpuW: avg(d.cpuW), gpuW: avg(d.gpuW), vramMax: max(d.vram), spillMax: max(d.spill),
    gpuMhzLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuMhz[i])) : null,
    gpuVLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuV[i])) : null,
    gpuWLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuW[i])) : null,
    hotspotMax: max(d.hotspot), memTempMax: max(d.memTemp),
    cpuFan: avg(d.cpuFanRpm), cpuFanMax: max(d.cpuFanRpm),
    pingNet: avg(d.pingNet), pingNetMax: max(d.pingNet), jitterNet: avg(d.jitterNet),
    lossNet: avg(d.lossNet), lossNetMax: max(d.lossNet), pingRouter: avg(d.pingRouter), netDownMax: max(d.netDown),
    deadMax: max(d.dead), deadEffect: deadConnectionEffect(d),
    dpcMax: max(d.dpc), dpc: dpcEffect(d), commitMax: max(d.commit),
    gameRamFirst: valid(d.gameRam)[0] ?? null, gameRamLast: valid(d.gameRam).at(-1) ?? null, gameRamMax: max(d.gameRam),
    trend: performanceTrend(d), pingLoad: pingUnderLoad(d), leak: memoryLeak(d),
    gpuFanLoad: loadIdx.length ? avg(loadIdx.map(i => d.gpuFanPct[i])) : null,
    // Pacing nur im Spielgeschehen (ab 40 FPS), Ladebildschirme verzerren sonst den Mittelwert
    pacing: avg(d.pacing.map((p, i) => d.fps[i] !== null && d.fps[i] >= 40 ? p : null)),
    notes: [...notes.values()].sort((a, b) => b.seconds - a.seconds),
  };
}

/** Anteil der gemessenen Werte (ohne Lücken), die die Bedingung erfüllen; null ohne Werte */
function share(a, test) {
  const v = valid(a);
  return v.length ? v.filter(test).length / v.length : null;
}

const median = a => {
  const v = valid(a).sort((x, y) => x - y);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};

/**
 * Leistung im Lauf der Sitzung: erstes gegen letztes Drittel (ohne die ersten 2 Minuten, dort wird oft noch geladen).
 * Erst ab 45 Minuten, sonst sagen die Drittel wenig. Unterschiedliche Spielszenen können den Vergleich verfälschen –
 * deshalb zählt der Abfall nur dann als Hauptaussage, wenn Speicher oder Temperaturen ihn erklären.
 */
function performanceTrend(d) {
  const n = d.t.length;
  if (!n || d.t[n - 1] - d.t[0] < 45 * 60) return null;
  const start = d.t[0] + 120, third = (d.t[n - 1] - start) / 3;
  const part = (from, to) => {
    const idx = d.t.map((t, i) => t >= from && t < to && d.fps[i] !== null ? i : -1).filter(i => i >= 0);
    const pick = a => idx.map(i => a[i]);
    const spikes = pick(d.spikes).reduce((x, y) => x + (y || 0), 0);
    return { sec: idx.length, fps: avg(pick(d.fps)), spikesPerMin: idx.length ? spikes / (idx.length / 60) : 0,
      cpuTemp: avg(pick(d.cpuTemp)), gpuTemp: avg(pick(d.gpuTemp)), gameRam: avg(pick(d.gameRam)) };
  };
  const first = part(start, start + third), last = part(d.t[n - 1] - third, d.t[n - 1] + 1);
  if (first.sec < 300 || last.sec < 300 || !first.fps || !last.fps) return null;
  const decline = last.fps < 0.85 * first.fps || (last.spikesPerMin > 2 && last.spikesPerMin >= 2 * first.spikesPerMin);
  // Speicherleck: eigenes statistisches Urteil (memoryLeak), nicht der grobe Vergleich erstes/letztes Drittel
  const leak = memoryLeak(d) !== null;
  const warmer = (first.cpuTemp !== null && last.cpuTemp !== null && last.cpuTemp - first.cpuTemp >= 5)
    || (first.gpuTemp !== null && last.gpuTemp !== null && last.gpuTemp - first.gpuTemp >= 5);
  return { first, last, decline, leak, warmer };
}

/**
 * Speicherleck statistisch – dasselbe Verfahren wie im Overlay (MemoryLeakTracker, Plan Probelauf Windrose W1):
 * Minuten-Mediane; Sprünge (> max(300 MB, 6 × Median der Minutenänderungen)) und Lücken trennen Abschnitte; in ruhigen
 * Abschnitten ab 5 Minuten die Theil-Sen-Steigung, nach Dauer gewichtet. Leck, wenn in den letzten 40 Minuten mindestens
 * 20 Minuten ruhig sind, die Steigung darin ≥ 25 MB/min ist, ≥ 85 % der ruhigen Zeit mit ≥ 15 MB/min steigt – und das
 * schon 10 Minuten vorher galt. Ergebnis: erste Feststellung mit Rate und Beginn, sonst null.
 */
const LEAK = { window: 40, persist: 10, minPoints: 5, minQuiet: 20, minRate: 25, risingRate: 15, risingShare: 0.85, minJump: 0.3, jumpFactor: 6 };
function memoryLeak(d) {
  const byMinute = new Map();
  d.t.forEach((t, i) => {
    const v = d.gameRam[i];
    if (v === null || t === null) return;
    const m = Math.floor(t / 60);
    if (!byMinute.has(m)) byMinute.set(m, []);
    byMinute.get(m).push(v);
  });
  const medians = [...byMinute].filter(([, v]) => v.length >= 6).sort((a, b) => a[0] - b[0]).map(([m, v]) => [m, median(v)]);
  if (medians.length < LEAK.minQuiet) return null;
  const theilSen = seg => {
    const sl = [];
    for (let i = 0; i < seg.length; i++) for (let j = i + 1; j < seg.length; j++)
      if (seg[j][0] > seg[i][0]) sl.push((seg[j][1] - seg[i][1]) / (seg[j][0] - seg[i][0]));
    return sl.length ? median(sl) : 0;
  };
  const evaluate = end => {
    const m = medians.filter(([t]) => t >= end - LEAK.window && t < end);
    if (m.length < 2) return null;
    const diffs = m.slice(1).map((x, i) => Math.abs(x[1] - m[i][1]));
    const jump = Math.max(LEAK.minJump, LEAK.jumpFactor * median(diffs));
    const segs = [[m[0]]];
    for (let i = 1; i < m.length; i++) {
      if (Math.abs(m[i][1] - m[i - 1][1]) > jump || m[i][0] - m[i - 1][0] > 2) segs.push([m[i]]);
      else segs[segs.length - 1].push(m[i]);
    }
    const quiet = segs.filter(sg => sg.length >= LEAK.minPoints);
    const total = quiet.reduce((a, sg) => a + sg[sg.length - 1][0] - sg[0][0], 0);
    if (total < LEAK.minQuiet) return null;
    const w = quiet.map(sg => ({ rate: theilSen(sg) * 1024, dur: sg[sg.length - 1][0] - sg[0][0], start: sg[0][0] }));
    const rate = w.reduce((a, x) => a + x.rate * x.dur, 0) / total;
    const risingW = w.filter(x => x.rate >= LEAK.risingRate);
    const rising = risingW.reduce((a, x) => a + x.dur, 0) / total;
    const since = risingW.length ? Math.min(...risingW.map(x => x.start)) : end;
    return { leak: rate >= LEAK.minRate && rising >= LEAK.risingShare, rate, since };
  };
  const last = medians[medians.length - 1][0] + 1;
  for (let end = LEAK.minQuiet; end <= last; end++) {
    const now = evaluate(end), before = evaluate(end - LEAK.persist);
    if (now && now.leak && before && before.leak) return { atMinute: end, rate: now.rate, sinceMinute: now.since };
  }
  return null;
}

/**
 * Bufferbloat: Ping in Sekunden mit viel Datenverkehr (wie im Overlay: ≥ 3 MB/s herunter oder ≥ 1 MB/s hoch)
 * gegenüber dem Rest, jeweils Median. Braucht genug Sekunden in beiden Gruppen.
 */
function pingUnderLoad(d) {
  const loaded = [], idle = [];
  d.pingNet.forEach((p, i) => {
    if (p === null) return;
    ((d.netDown[i] || 0) >= 3 || (d.netUp[i] || 0) >= 1 ? loaded : idle).push(p);
  });
  if (loaded.length < 20 || idle.length < 60) return null;
  const withLoad = median(loaded), without = median(idle);
  return { withLoad, without, rise: withLoad - without, sec: loaded.length };
}

/**
 * Tote Verbindungen (vom Server geschlossen, vom Spiel nicht – CLOSE_WAIT): Ruckler und FPS in Phasen mit
 * mindestens 3 toten Verbindungen, die schon 30 s bestehen (wie im Overlay), gegenüber dem Rest der Sitzung.
 * Nur Sekunden mit Bilddaten; beide Phasen brauchen mindestens 30 s, sonst ist der Vergleich nicht belastbar.
 */
const DEAD_THRESHOLD = 3, DEAD_SECONDS = 30;
function deadConnectionEffect(d) {
  if (!d.dead.some(v => v !== null)) return null;
  const high = { sec: 0, spikes: 0, fps: [] }, low = { sec: 0, spikes: 0, fps: [] };
  let run = 0;
  d.dead.forEach((v, i) => {
    run = v !== null && v >= DEAD_THRESHOLD ? run + 1 : 0;
    if (d.fps[i] === null) return;
    const g = run >= DEAD_SECONDS ? high : low;
    g.sec++; g.spikes += d.spikes[i] || 0; g.fps.push(d.fps[i]);
  });
  if (high.sec < 30 || low.sec < 30) return { highSec: high.sec, lowSec: low.sec, comparable: false };
  return {
    highSec: high.sec, lowSec: low.sec, comparable: true,
    spikesHigh: high.spikes / (high.sec / 60), spikesLow: low.spikes / (low.sec / 60),
    fpsHigh: avg(high.fps), fpsLow: avg(low.fps),
  };
}

/**
 * Treiber-Unterbrechungen (DPC) relativ zur üblichen Last der Sitzung – wie im Overlay (DpcBaseline, Plan Probelauf
 * Windrose W2): Grundwert = Median der Sitzung, erhöht ab max(25 %, Grundwert + 10). Verglichen wird die Ruckler-Quote
 * (Anteil Sekunden mit Rucklern) im Spiel mit und ohne erhöhte Last. Bremsend, wenn sie bei erhöhter Last mindestens
 * doppelt so hoch und mindestens 3 Prozentpunkte höher ist, bei mindestens 60 solchen Sekunden.
 */
const DPC = { fixed: 25, above: 10, minSeconds: 60, factor: 2, minDiff: 0.03, infoBase: 20 };
function dpcEffect(d) {
  const all = valid(d.dpc);
  if (!all.length) return null;
  const base = median(all), threshold = Math.max(DPC.fixed, base + DPC.above);
  const high = { sec: 0, hit: 0 }, low = { sec: 0, hit: 0 };
  let highAll = 0;
  d.dpc.forEach((v, i) => {
    if (v === null) return;
    if (v >= threshold) highAll++;
    if (d.fps[i] === null || d.spikes[i] === null) return;
    const g = v >= threshold ? high : low;
    g.sec++; if (d.spikes[i] > 0) g.hit++;
  });
  const quoteHigh = high.sec ? high.hit / high.sec : null, quoteLow = low.sec ? low.hit / low.sec : null;
  const hurts = high.sec >= DPC.minSeconds && quoteLow !== null
    && quoteHigh >= DPC.factor * quoteLow && quoteHigh - quoteLow >= DPC.minDiff;
  return { base, threshold, highShare: highAll / all.length, highSec: high.sec, quoteHigh, quoteLow, hurts };
}

/** Bremsten die toten Verbindungen messbar? Mehr als doppelt so viele Ruckler (und spürbar viele) oder 10 % weniger FPS. */
function deadConnectionsHurt(st) {
  const e = st.deadEffect;
  if (!e || !e.comparable) return false;
  return (e.spikesHigh > 2 && e.spikesHigh >= 2 * e.spikesLow) || (e.fpsHigh && e.fpsLow && e.fpsHigh < 0.9 * e.fpsLow);
}

const fmt = (v, dec = 0, unit = "") => v === null || v === undefined ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: dec, maximumFractionDigits: dec }) + unit;
const pct = v => fmt(v * 100, 0, " %");
const clock = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
/** "Warframe.x64 · 16.10. 20:10" aus Spielname und Startzeit "2026-10-16 20:10:00" */
const sessionLabel = s => {
  const m = (s.meta["Start"] || "").match(/^\d{4}-(\d{2})-(\d{2}) (\d{2}:\d{2})/);
  return (s.meta["Spiel"] || s.name).replace(/\.exe$/i, "") + (m ? ` · ${m[2]}.${m[1]}. ${m[3]}` : "");
};

function render() {
  document.body.classList.toggle("compact", sessions.length > 0);
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  if (sessions.length >= 2) tabs.append(tab("Vergleich", null, active === -1, () => { active = -1; render(); }));
  sessions.forEach((s, i) => tabs.append(tab(sessionLabel(s), s.color, active === i, () => { active = i; render(); }, () => {
    sessions.splice(i, 1);
    active = sessions.length >= 2 ? -1 : 0;
    render();
  })));

  const view = document.getElementById("view");
  view.innerHTML = "";
  charts.length = 0;
  zoom = null;
  if (!sessions.length) return;
  if (active === -1) renderComparison(view); else renderSession(view, sessions[active]);
}

function tab(text, color, isActive, onClick, onClose) {
  const el = document.createElement("div");
  el.className = "tab" + (isActive ? " active" : "");
  el.innerHTML = (color ? `<span class="dot" style="background:${color}"></span>` : "") + esc(text) + (onClose ? `<span class="x" title="Entfernen">✕</span>` : "");
  el.onclick = ev => { if (ev.target.classList.contains("x")) onClose(); else onClick(); };
  return el;
}

/**
 * Abschnitt; mit opt.id aufklappbar (Zustand bleibt im Browser gespeichert), mit opt.help samt Lesehilfe.
 * Gibt den Inhaltsbereich zurück, in den der Abschnitt seine Inhalte schreibt.
 */
function section(parent, title, sub, opt = {}) {
  const s = document.createElement("section");
  const heading = `<h2>${esc(title)}${sub ? `<small>${esc(sub)}</small>` : ""}</h2>`;
  parent.append(s);
  if (!opt.id) {
    s.innerHTML = heading;
    if (opt.help) s.insertAdjacentHTML("beforeend", `<details class="help"><summary>So liest du das</summary><div>${opt.help}</div></details>`);
    if (opt.fixed) s.classList.add("result-section");
    return s;
  }

  const key = "perfoverlay.fold." + opt.id;
  let open = opt.open ?? false;
  try { const saved = localStorage.getItem(key); if (saved !== null) open = saved === "1"; } catch { /* privates Fenster o. Ä. */ }
  s.innerHTML = `<details class="fold"${open ? " open" : ""}><summary>${heading}</summary><div class="body"></div></details>`;
  const det = s.querySelector("details"), body = s.querySelector(".body");
  if (opt.help) body.insertAdjacentHTML("beforeend", `<details class="help"><summary>So liest du das</summary><div>${opt.help}</div></details>`);
  det.addEventListener("toggle", () => {
    try { localStorage.setItem(key, det.open ? "1" : "0"); } catch { }
    // Diagramme in eingeklappten Abschnitten haben keine Breite – beim Aufklappen neu zeichnen
    if (det.open) charts.filter(c => body.contains(c.wrap)).forEach(draw);
  });
  return body;
}

function shareBar(shares) {
  const order = ["Gpu", "Cpu", "Limit", "Mixed", "None"].filter(k => shares[k] > 0);
  return `<div class="sharebar">${order.map(k => `<div style="width:${shares[k] * 100}%;background:${KINDS[k].color}" title="${KINDS[k].label} ${pct(shares[k])}"></div>`).join("")}</div>
          <div class="legend">${order.map(k => `<span style="--c:${KINDS[k].color}">${KINDS[k].label} <b>${pct(shares[k])}</b></span>`).join("")}</div>`;
}

function renderSession(view, s) {

      ${m["RAM"] ? `<span>RAM <b>${esc(m["RAM"])}</b></span>` : ""}
      ${m["Windows"] ? `<span>Windows <b>${esc(m["Windows"])}</b></span>` : ""}

      ${m["CPU-Sensoren"] ? `<span>CPU-Sensoren <b>${esc(m["CPU-Sensoren"])}</b></span>` : ""}
      ${m["Monitor"] ? `<span>Monitor <b>${esc(monitorHz(m["Monitor"]))}</b></span>` : ""}
      ${m["Energieplan"] ? `<span>Energie <b>${esc(m["Energieplan"])}</b></span>` : ""}

      ${m["Speicher-Integrität"] ? `<span>Speicher-Integrität <b>${esc(m["Speicher-Integrität"])}</b></span>` : ""}

    </div>`);

  const has = key => d[key].some(v => v !== null);
  /** Diagramm nur mit Linien, für die es Werte gibt – ganz ohne Werte entfällt es (der Grund steht im Hinweis darüber) */
  const plot = (parent, title, series, opt) => { const x = series.filter(x => has(x.key)); if (x.length) chart(parent, s, title, x, opt); };

  // Ergebnis zuerst: Dafür ist PerfOverlay da – was hat gebremst, woran sieht man das, was hilft
  const res = section(view, "Ergebnis: Was hat gebremst?", "", { fixed: true, help: HELP.result });
  res.insertAdjacentHTML("beforeend", resultBlock(s));
  gapNote(res, s, ["cpuBusy", "gpuBusy", "thread"]);
  plot(res, "Arbeitszeit pro Bild (ms) – der höhere Wert bremst", [
    { key: "cpuBusy", label: "CPU", color: "var(--cpu)" },
    { key: "gpuBusy", label: "GPU", color: "var(--gpu)" },
    { key: "ft", label: "Bildzeit", color: "var(--muted)", dash: "3 3" },
  ], { min: 0, unit: " ms", strip: true });
  plot(res, "Auslastung (%)", [
    { key: "gpu", label: "GPU", color: "var(--gpu)" },
    { key: "thread", label: "Hauptthread", color: "var(--cpu)" },
    { key: "cpu", label: "CPU gesamt", color: "var(--limit)" },
  ], { min: 0, max: 100, unit: " %" });

  const glance = section(view, "Auf einen Blick", "automatische Einordnung", { id: "glance", open: true, help: HELP.glance });
  const ins = insightsFor(s);
  glance.insertAdjacentHTML("beforeend", insightList(ins.main) + (ins.side.length ? `<div class="side-head">Nebenbefunde</div>${insightList(ins.side)}` : "")
    + `<p class="insights-hint">Regelbasierte Einordnung nach festen Schwellen – ein Hinweis, keine Diagnose.</p>`);

  const nt = section(view, "Meldungen", "wie lange sie aktiv waren", { id: "notes", open: true, help: HELP.notes });
  nt.insertAdjacentHTML("beforeend", st.notes.length
    ? `<table class="notes"><tbody>${st.notes.slice(0, 15).map(n => `<tr><td>${esc(n.text)}</td><td class="n">${clock(n.seconds)}</td><td class="n">ab ${clock(n.first - d.t[0])}</td></tr>`).join("")}</tbody></table>`
    : `<p class="empty">Keine Meldungen in dieser Sitzung.</p>`);

  // Zusammenfassung: nur, was zum Engpass und zum Spielgefühl gehört – Temperaturen & Co. stehen in ihren Abschnitten
  const fg = st.fpsApp && st.fps && st.fpsApp < st.fps * 0.8;
  const thr = throttleShares(st);
  const throttleText = thr.cpu < 0.01 && thr.gpu < 0.01 ? "keine"
    : [thr.cpu >= 0.01 ? `CPU ${pct(thr.cpu)}` : "", thr.gpu >= 0.01 ? `GPU ${pct(thr.gpu)}` : ""].filter(Boolean).join(" · ");
  const sum = section(view, "Zusammenfassung", "", { id: "summary", open: true, help: HELP.summary });
  sum.insertAdjacentHTML("beforeend", `
    <div class="cards">
      ${card("Ø FPS", fmt(st.fps, 0), fg ? `${fmt(st.fpsApp, 0)} vom Spiel` : "")}
      ${card("Ø 1%-Low", fmt(st.low1, 0), `schlechteste Sekunde ${fmt(st.worstLow1, 0)}`)}
      ${card("Hauptengpass", st.top ? KINDS[st.top[0]]?.short ?? st.top[0] : "–", st.top ? pct(st.top[1]) + " der Zeit" : "")}
      ${card("Ø FPS im CPU-Limit", fmt(st.fpsCpu, 0), st.fpsCpu === null ? "kein CPU-Limit" : "hier wirken RAM/CPU")}
      ${card("Ruckler", fmt(st.spikesPerMin, 1), `pro Minute · ${fmt(st.spikes, 0)} gesamt`)}
      ${card("Drosselung", throttleText, throttleText === "keine" ? "weder CPU noch GPU" : "Anteil der Spielzeit")}
    </div>`);

  const img = section(view, "Bild und Ruckler", "Mauszeiger für Einzelwerte, Bereich ziehen zum Vergrößern", { id: "frames", help: HELP.frames });
  img.insertAdjacentHTML("beforeend", `
    <div class="cards">
      ${card("Ø Bildzeit", fmt(st.ft, 1), "ms")}
      ${card("Frame-Pacing", st.pacing === null ? "–" : "±" + fmt(st.pacing, 1) + " <small>ms</small>",
          st.pacing === null ? "nicht aufgezeichnet" : pacingRating(st.pacing, st.ft))}
    </div>`);
  gapNote(img, s, ["pacing"]);
  plot(img, "Bilder pro Sekunde", [
    { key: "fps", label: "FPS", color: s.color },
    { key: "low1", label: "1%-Low", color: "var(--muted)", dash: "3 3" },
  ], { min: 0, markers: true, strip: true });

  const cpu = section(view, "Prozessor", "", { id: "cpu", help: HELP.cpu });
  if (st.cpuTempMax !== null || st.cpuW !== null || st.cpuFan !== null)
    cpu.insertAdjacentHTML("beforeend", `<div class="cards">
      ${card("CPU max", fmt(st.cpuTempMax, 0, " °C"), "")}
      ${card("Ø Leistung", fmt(st.cpuW, 0, " W"), "")}
      ${card("Ø Lüfter", fmt(st.cpuFan, 0), st.cpuFan === null ? "" : `U/min · max ${fmt(st.cpuFanMax, 0)}`)}
    </div>`);
  gapNote(cpu, s, ["cpuTemp", "cpuW", "cpuFanRpm"]);
  plot(cpu, "CPU-Temperatur (°C)", [{ key: "cpuTemp", label: "CPU", color: "var(--cpu)" }], { unit: " °C" });
  plot(cpu, "CPU-Lüfter (U/min)", [{ key: "cpuFanRpm", label: "CPU-Lüfter", color: "var(--cpu)" }], { min: 0, unit: " U/min" });

  const gpu = section(view, "Grafikkarte", "", { id: "gpu", help: HELP.gpu });
  if (st.gpuTempMax !== null || st.gpuMhzLoad !== null)
    gpu.insertAdjacentHTML("beforeend", `<div class="cards">
      ${card("GPU max", fmt(st.gpuTempMax, 0, " °C"), [
          st.hotspotMax !== null ? `Hotspot ${fmt(st.hotspotMax, 0)}` : "",
          st.memTempMax !== null ? `Speicher ${fmt(st.memTempMax, 0)} °C` : "",
        ].filter(Boolean).join(" · "))}
      ${card("GPU unter Last", fmt(st.gpuMhzLoad, 0, " MHz"), [
          st.gpuVLoad !== null ? `${fmt(st.gpuVLoad, 3)} V` : "",
          st.gpuWLoad !== null ? `${fmt(st.gpuWLoad, 0)} W` : "",
          st.gpuFanLoad !== null ? `Lüfter ${fmt(st.gpuFanLoad, 0)} %` : "",
        ].filter(Boolean).join(" · ") || "GPU ≥ 90 % ausgelastet")}
    </div>`);
  gapNote(gpu, s, ["gpuTemp", "gpuMhz", "gpuW", "gpuV", "hotspot", "memTemp", "gpuFanRpm"]);
  plot(gpu, "GPU-Temperaturen (°C)", [
    { key: "gpuTemp", label: "GPU", color: "var(--gpu)" },
    { key: "hotspot", label: "Hotspot", color: "var(--gpu)", dash: "4 3" },
    { key: "memTemp", label: "Speicher", color: "var(--bad)", dash: "2 2" },
  ], { unit: " °C" });
  plot(gpu, "GPU-Takt (MHz)", [{ key: "gpuMhz", label: "Takt", color: "var(--gpu)" }], { unit: " MHz" });
  plot(gpu, "GPU-Spannung (V)", [{ key: "gpuV", label: "Spannung", color: "var(--limit)" }], { unit: " V" });
  plot(gpu, "GPU-Lüfter (U/min)", [{ key: "gpuFanRpm", label: "GPU-Lüfter", color: "var(--gpu)" }], { min: 0, unit: " U/min" });

  // Speicher und Treiber: Speicherleck, Speicherzusage, Treiber-Unterbrechungen
  if (st.gameRamMax !== null || st.commitMax !== null || st.dpcMax !== null || s.cols.has("RAM_Proz")) {
    const sys = section(view, "Speicher und Treiber", "Arbeitsspeicher, Speicher des Spiels, Treiber-Unterbrechungen", { id: "system", help: HELP.system });
    if (st.gameRamMax !== null || st.commitMax !== null || st.dpcMax !== null)
      sys.insertAdjacentHTML("beforeend", `<div class="cards">
        ${card("Speicher des Spiels", st.gameRamFirst === null ? "–" : fmt(st.gameRamFirst, 1) + " → " + fmt(st.gameRamLast, 1) + " <small>GB</small>", "Beginn → Ende")}
        ${card("Speicherzusage max", fmt(st.commitMax, 0, " %"), "ab 90 % wird es knapp")}
        ${card("Treiber (DPC) max", fmt(st.dpcMax, 0, " %"), st.dpc ? `üblich ${fmt(st.dpc.base, 0)} %` + (st.dpc.highShare ? ` · ${pct(st.dpc.highShare)} der Zeit ≥ ${fmt(st.dpc.threshold, 0)} %` : "") : "eines Kerns")}
      </div>`);
    gapNote(sys, s, ["gameRam", "commit", "dpc"]);
    plot(sys, "Speicher des Spiels (GB)", [{ key: "gameRam", label: "Spiel", color: s.color }], { min: 0, unit: " GB" });
    plot(sys, "Arbeitsspeicher (%)", [
      { key: "ram", label: "RAM belegt", color: "var(--limit)" },
      { key: "commit", label: "Speicherzusage", color: "var(--bad)", dash: "4 3" },

  // Verbindung zuletzt und zugeklappt: beeinflusst den Lag in Online-Spielen, nicht die FPS

  if (st.pingNet !== null)
    net.insertAdjacentHTML("beforeend", `<div class="cards">
      ${card("Ø Ping Internet", fmt(st.pingNet, 0) + " <small>ms</small>", `±${fmt(st.jitterNet, 0)} ms Schwankung`)}
      ${card("Verlust max", fmt(st.lossNetMax, 0, " %"), "")}
    </div>`);
  if (st.pingLoad)
    net.insertAdjacentHTML("beforeend", `<div class="cards">

  plot(net, "Ping (ms)", [

        ${card("Ohne tote Verbindungen", fmt(e.spikesLow, 1) + " <small>Ruckler/min</small>", `Ø ${fmt(e.fpsLow, 0)} FPS · ${fmt(e.lowSec / 60, 0)} Min.`)}

/** "3440×1440, 120 Hz (möglich 144 Hz)" → "120 von 144 Hz"; ohne höhere Möglichkeit nur "144 Hz" */
function monitorHz(text) {
  const cur = text.match(/(\d+) Hz/), max = text.match(/möglich (\d+) Hz/);
  if (!cur) return text;
  return max ? `${cur[1]} von ${max[1]} Hz` : `${cur[1]} Hz`;
}

/** Langsamer Zeitgeber (HPET/ACPI) laut Sitzungskopf, z. B. "HPET (14,318 MHz, 900 ns pro Abfrage, …)" – sonst null */
function slowTimer(s) {
  const t = s.meta["Zeitgeber"];
  return t && /^(HPET|ACPI)/.test(t) ? t : null;
}

/** Anteil der Spielzeit, in der CPU bzw. GPU gedrosselt haben (aus den Meldungen des Overlays) */
function throttleShares(st) {
  return { cpu: noteShare(st, /CPU drosselt/), cpuTemp: noteShare(st, /CPU drosselt: Temperatur/), gpu: noteShare(st, /GPU drosselt/) };
}

const RESULT = {
  Gpu: {
    title: "Die Grafikkarte hat gebremst",
    meaning: "Die Grafikkarte war voll ausgelastet, der Prozessor hätte schneller liefern können. Das ist der Normalfall.",
    tips: ["Auflösung senken oder Upscaling nutzen (DLSS, FSR, XeSS) – das bringt meist am meisten",
      "Aufwendige Effekte reduzieren: Schatten, Raytracing, Volumetrik, Kantenglättung",
      "Ein schnellerer Prozessor oder Arbeitsspeicher bringt hier kaum etwas"],
  },
  Cpu: {
    title: "Der Prozessor hat gebremst",
    meaning: "Die Grafikkarte musste auf den Prozessor warten. Oft bremst ein einzelner Kern, der Hauptthread, auch wenn die CPU insgesamt wenig ausgelastet wirkt.",
    tips: ["Sichtweite, Figuren- und Objektdichte sowie Physik-Details senken",
      "Programme im Hintergrund schließen (Browser, Launcher, Aufnahme-Software)",
      "Arbeitsspeicher im BIOS mit XMP bzw. EXPO auf vollen Takt stellen",
      "Grafikdetails senken bringt hier kaum etwas – eine höhere Auflösung kostet dafür fast keine FPS"],
  },
  Limit: {
    title: "Ein FPS-Limit hat die Bildrate begrenzt",
    meaning: "Die Bildrate wurde absichtlich festgehalten (FPS-Limit oder VSync). Prozessor und Grafikkarte hatten noch Reserven.",
    tips: ["Für mehr FPS das Limit anheben, z. B. auf die Bildwiederholrate des Monitors",
      "Alternativ die Grafik höher stellen – das kostet bis zum Limit keine FPS"],
  },
  Mixed: {
    title: "Kein eindeutiger Engpass",
    meaning: "Prozessor und Grafikkarte waren ungefähr gleich schnell.",
    tips: ["Änderungen wirken auf beiden Seiten nur begrenzt – erst Grafikeinstellungen, dann Sichtweite probieren"],
  },
};

/** Großer Ergebnis-Block: Hauptengpass, Anteile, Belege und was mehr FPS bringt */
function resultBlock(s) {
  const st = s.stats, sh = st.shares;
  const withFrames = 1 - (sh.None || 0);
  if (withFrames < 0.05) return `<p class="empty">Diese Sitzung enthält kaum Bilddaten – ein Engpass lässt sich nicht bestimmen.</p>`;

  const ranked = ["Gpu", "Cpu", "Limit", "Mixed"].map(k => [k, (sh[k] || 0) / withFrames]).sort((a, b) => b[1] - a[1]);
  const [top, topShare] = ranked[0];
  const clear = topShare >= 0.6;
  const r = RESULT[top];
  const title = clear ? r.title : `Wechselnder Engpass: ${KINDS[top].short} ${pct(topShare)}, ${KINDS[ranked[1][0]].short} ${pct(ranked[1][1])}`;
  const sub = clear ? `${pct(topShare)} der Spielzeit ${KINDS[top].label}` : "kein Teil bremste mehr als 60 % der Zeit";

  // Belege: Wie viel der Bildzeit arbeitet die GPU, wie lange wartet sie auf die CPU? (Die CPU-Arbeitszeit von
  // PresentMon enthält auch das Warten auf die GPU – als Beleg taugt sie deshalb nicht.)
  const ev = [];
  if (st.gpuBusy !== null && st.ft)
    ev.push(`Die GPU arbeitet <b>${fmt(st.gpuBusy, 1)} von ${fmt(st.ft, 1)} ms</b> pro Bild (${pct(Math.min(1, st.gpuBusy / st.ft))})`
      + (st.gpuWait !== null ? ` und wartet im Schnitt <b>${fmt(st.gpuWait, 1)} ms</b> pro Bild auf die CPU` : ""));
  const load = [st.gpu !== null ? `GPU-Last Ø ${fmt(st.gpu, 0)} %` : "", st.thread !== null ? `Hauptthread Ø ${fmt(st.thread, 0)} %` : ""].filter(Boolean);
  if (load.length) ev.push(load.join(" · "));

  let tips = [...r.tips];
  if (!clear) tips = [...RESULT[ranked[0][0]].tips.slice(0, 2), ...RESULT[ranked[1][0]].tips.slice(0, 2)];
  const thr = throttleShares(st);
  if (thr.cpuTemp >= 0.05) tips.unshift(`Zuerst die Kühlung: Die CPU drosselte ${pct(thr.cpuTemp)} der Zeit wegen Temperatur – das kostet FPS, egal wo der Engpass liegt`);
  if (thr.gpu >= 0.05) tips.unshift(`Zuerst die Kühlung: Die Grafikkarte drosselte ${pct(thr.gpu)} der Zeit – Staub, Lüfterkurve und Luftstrom prüfen`);
  // Systemeinstellungen aus dem Sitzungskopf (Plan Engpass-Erweiterung, T1–T3, T5–T7)
  const m = s.meta, extra = [];
  const hz = (m["Monitor"] || "").match(/(\d+) Hz \(möglich (\d+) Hz\)/);
  const balanced = /Ausbalanciert|Balanced|Energiespar|Power saver/i.test(m["Energieplan"] || "");
  const win10 = /^10\.0\.(\d+)/.exec(m["Windows"] || "");
  if (clear && top === "Limit" && hz && hz[2] - hz[1] >= 15 && st.fps && Math.abs(st.fps - hz[1]) <= hz[1] * 0.05)
    tips.unshift(`Der Monitor lief mit ${hz[1]} Hz, möglich sind ${hz[2]} Hz – in den Windows-Anzeigeeinstellungen umstellen, dann sind mehr FPS möglich`);
  if (clear && top === "Limit" && noteShare(st, /^FPS über \d+ Hz/) > 0)
    extra.push("Mit G-Sync/FreeSync: ein FPS-Limit knapp unter der Bildwiederholrate setzen (z. B. 141 bei 144 Hz) – so bleibt das Bild ohne Risse");
  if (top === "Cpu") {
    if (balanced) extra.push(`Energieplan „Höchstleistung“ testen (aktiv war „${m["Energieplan"].split(",")[0]}“)`);
    if (m["Hybrid-CPU"] && win10 && +win10[1] < 22000)
      extra.push("Windows 11 verteilt Spiele auf Prozessoren mit P- und E-Kernen besser als Windows 10");
    if (m["Speicher-Integrität"] === "an")
      extra.push("Speicher-Integrität (Windows-Sicherheit → Gerätesicherheit) ist an: Ausschalten bringt in CPU-lastigen Spielen einige Prozent, "
        + "schwächt aber den Schutz vor Schadsoftware – eine Abwägung, keine Empfehlung");
  }
  if (top === "Gpu" && m["Resizable BAR"] === "aus")
    extra.push("Resizable BAR im BIOS aktivieren („Above 4G Decoding“ und „Re-Size BAR“) – bringt in manchen Spielen einige Prozent");
  if (st.spikesPerMin > 2 && noteShare(st, /unklar/) > 0)
    extra.push("Häufige Ruckler ohne erkennbare Ursache: Overlays und Aufnahme-Software (Discord, Steam, GeForce Experience, AMD) testweise abschalten");
  // Passende System-Tipps direkt hinter den ersten allgemeinen Tipp – sie sind konkreter als die übrigen
  const firstBase = tips.findIndex(t => !t.startsWith("Zuerst"));
  tips.splice(firstBase < 0 ? tips.length : firstBase + 1, 0, ...extra);
  if (noteShare(st, /Akkubetrieb/) > 0.1) tips.unshift("Zuerst das Netzteil anschließen: Im Akkubetrieb ist die Leistung begrenzt");
  else if (noteShare(st, /Stromsparmodus|Energieplan .* drosselt/) > 0.1)
    tips.unshift("Zuerst den Energiesparmodus ausschalten: Er drosselt Prozessor und Grafikkarte");

  if (st.trend && st.trend.decline && st.trend.leak)
    tips.unshift("Spiel zwischendurch neu starten: Sein Speicher wuchs stetig und die Leistung sank – vermutlich ein Speicherleck im Spiel");
  if (deadConnectionsHurt(st)) tips.unshift("Zuerst das Spiel neu starten: Es hielt tote Verbindungen offen und ruckelte damit deutlich mehr – "
    + "ein Fehler im Spiel, den ein Neustart vorübergehend behebt; dem Hersteller melden hilft dauerhaft");
  if (slowTimer(s)) tips.unshift("Zuerst den Zeitgeber: Windows nutzte den langsamen Zeitgeber " + slowTimer(s).split(" ")[0]
    + " statt des TSC – jede Zeitabfrage des Spiels kostet ein Vielfaches; Ursache steht in den Meldungen");

  tips = tips.slice(0, 6);   // mehr liest niemand – die wichtigsten stehen vorn

  return `<div class="result" style="--c:${KINDS[clear ? top : "Mixed"].color}">
      <div class="r-title">${esc(title)}</div>
      <div class="r-sub">${esc(sub)}${clear ? ` – ${esc(r.meaning)}` : ""}</div>
    </div>
    ${shareBar(sh)}
    ${ev.length ? `<div class="evidence">${ev.map(x => `<div>${x}</div>`).join("")}</div>` : ""}
    <div class="tips"><b>Was bringt mehr FPS?</b><ul>${tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
}

// ---------------------------------------------------------------- Fehlende Daten

/** Messwert → Anzeigename, CSV-Spalte und Datenquelle. Je nach PC liefert nicht jede Quelle etwas. */
const FIELDS = {
  cpuTemp: ["CPU-Temperatur", "CPU_Temp", "hwinfo"],
  cpuW: ["CPU-Leistung", "CPU_W", "hwinfo"],
  cpuFanRpm: ["CPU-Lüfter", "CPU_Luefter_U_min", "cpuFan"],
  gpuTemp: ["GPU-Temperatur", "GPU_Temp", "nvml"],
  gpuMhz: ["GPU-Takt", "GPU_MHz", "nvml"],
  gpuW: ["GPU-Leistung", "GPU_W", "nvml"],
  gpuV: ["GPU-Spannung", "GPU_V", "hwinfo"],
  hotspot: ["Hotspot", "GPU_Hotspot", "hwinfo"],
  memTemp: ["Speichertemperatur", "GPU_Speicher_Temp", "memSensor"],
  gpuFanRpm: ["GPU-Lüfter", "GPU_Luefter_U_min", "hwinfo"],
  cpuBusy: ["CPU-Arbeitszeit", "CPU_Busy_ms", "frames"],
  gpuBusy: ["GPU-Arbeitszeit", "GPU_Busy_ms", "frames"],
  thread: ["Hauptthread", "Hauptthread_Proz", "process"],
  pacing: ["Frame-Pacing", "Pacing_ms", "frames"],
  pingNet: ["Ping", "Ping_Internet_ms", "ping"],
  dead: ["Verbindungen des Spiels", "Tote_Verbindungen", "old"],
  gameRam: ["Speicher des Spiels", "Spiel_RAM_GB", "process"],
  commit: ["Speicherzusage", "Commit_Proz", "old"],
  dpc: ["Treiber-Unterbrechungen", "DPC_max_Proz", "old"],
};

const GAP_REASONS = {
  old: "Diese Aufzeichnung stammt aus einer älteren Version von PerfOverlay, die diese Werte noch nicht erfasst hat.",
  hwinfo: "HWiNFO lief während der Aufzeichnung nicht oder ohne „Shared Memory Support“ (HWiNFO → Einstellungen). "
    + "In der kostenlosen Version muss die Option alle 12 Stunden neu eingeschaltet werden.",
  cpuFan: "HWiNFO meldet für dieses Mainboard keinen Lüfter mit „CPU“ im Namen – z. B. weil der Kühler an einem anderen Anschluss hängt.",
  cpuSensor: "CPU-Temperatur und -Leistung liest PerfOverlay über den Treiber PawnIO (pawnio.eu, mit Admin-Rechten) oder aus HWiNFO "
    + "mit „Shared Memory Support“. Während der Aufzeichnung war keins von beiden verfügbar.",
  cpuFanPort: "Am Lüfteranschluss für die CPU wurde keine Drehzahl gefunden – z. B. weil der Kühler an einem anderen Anschluss hängt.",
  gpuSensor: "Die Grafikkarte bzw. ihr Treiber stellt diese Werte nicht bereit – z. B. den Hotspot bei RTX-50-Karten oder die "
    + "Lüfterdrehzahl bei sehr alten Treibern.",
  nvml: "Diese Werte liest PerfOverlay direkt nur bei NVIDIA- und AMD-Grafikkarten aus. Bei anderen Grafikkarten (z. B. Intel Arc) fehlen sie.",
  memSensor: "Nicht jede Grafikkarte hat einen Temperatursensor für den Grafikspeicher.",
  frames: "Die Bildmessung hat dazu keine Werte geliefert.",
  process: "Das Spiel ließ sich nicht genauer auslesen, z. B. wegen eines Anti-Cheat-Schutzes.",
  ping: "Die Ping-Messung war ausgeschaltet (Einstellung „PingTarget“ leer) oder es bestand keine Verbindung.",
};

/** Schreibt einen Hinweis in den Abschnitt, welche der Werte fehlen und warum – gruppiert nach Grund. */
function gapNote(parent, s, keys) {
  const has = key => s.d[key].some(v => v !== null);
  const groups = new Map();
  for (const key of keys) {
    if (has(key)) continue;
    const [label, column, source] = FIELDS[key];
    let reason = source;
    // Ab Version 0.5 liest PerfOverlay die GPU selbst und die CPU über PawnIO oder HWiNFO (Kopfzeile "CPU-Sensoren")
    const modern = !!s.meta["CPU-Sensoren"];
    const gpuField = ["gpuV", "hotspot", "gpuFanRpm", "memTemp"].includes(key);
    if (!s.cols.has(column)) reason = "old";
    else if (modern && gpuField) reason = source === "memSensor" ? "memSensor" : "gpuSensor";
    else if (modern && source === "hwinfo") reason = "cpuSensor";
    else if (modern && source === "cpuFan") reason = has("cpuTemp") ? "cpuFanPort" : "cpuSensor";
    // Ältere Aufzeichnungen: Fehlt HWiNFO ganz, ist das der eigentliche Grund – nicht der fehlende Lüfter oder Sensor
    else if ((source === "cpuFan" && !has("cpuTemp")) || (source === "memSensor" && !has("hotspot"))) reason = "hwinfo";
    groups.set(reason, [...(groups.get(reason) || []), label]);
  }
  if (!groups.size) return;
  parent.insertAdjacentHTML("beforeend", `<div class="gaps">${[...groups].map(([reason, labels]) =>
    `<p><b>Nicht aufgezeichnet: ${esc(labels.join(", "))}.</b> ${esc(GAP_REASONS[reason])}</p>`).join("")}</div>`);
}

// ---------------------------------------------------------------- Einordnung

const LEVEL_ICON = { bad: "!", warn: "!", info: "i", good: "✓" };
const LEVEL_ORDER = { bad: 0, warn: 1, info: 2, good: 3 };

/** Anteil der Sitzung (0–1), in der eine Meldung aktiv war, deren Text auf das Muster passt */
function noteShare(st, pattern) {
  if (!st.duration) return 0;
  return st.notes.filter(n => pattern.test(n.text)).reduce((sum, n) => sum + n.seconds, 0) / st.duration;
}

/**
 * Kernaussagen zu einer Sitzung – feste Regeln mit denselben Schwellen wie im Overlay, keine Statistik-Magie.
 * "main": was Bildrate und Spielgefühl betrifft, mit dem Engpass zuerst. "side": Nebenbefunde zur Gesundheit
 * der Hardware (Temperaturen, Verbindung). "!" ist echter Drosselung vorbehalten, sie kostet FPS.
 * Formulierungen bewusst vorsichtig ("deutet auf"), denn Messwerte allein kennen die Ursache nicht immer.
 */
function insightsFor(s) {
  const st = s.stats, main = [], side = [];
  const add = (list, level, text) => list.push({ level, text });

  // Engpass – immer die erste Aussage
  const sh = st.shares, withFrames = 1 - (sh.None || 0);
  if (withFrames >= 0.05) {
    const [top, share] = ["Gpu", "Cpu", "Limit", "Mixed"].map(k => [k, (sh[k] || 0) / withFrames]).sort((a, b) => b[1] - a[1])[0];
    if ((sh.Cpu || 0) / withFrames >= 0.3) add(main, "warn", `Häufig CPU-limitiert (${pct((sh.Cpu || 0) / withFrames)} der Zeit): Grafikeinstellungen senken bringt hier wenig – Details unter „Ergebnis“.`);
    else if (top === "Gpu" && share >= 0.6) add(main, "info", `Überwiegend GPU-limitiert (${pct(share)} der Zeit) – der Normalfall; mehr FPS gibt es über die Grafikeinstellungen.`);
    else if (top === "Limit" && share >= 0.5) add(main, "good", `Überwiegend im FPS-Limit (${pct(share)} der Zeit) – das System hat Reserven.`);
    else add(main, "info", `Wechselnder Engpass: ${KINDS[top].short} ${pct(share)} der Zeit – Details unter „Ergebnis“.`);
  }

  // Drosselung kostet FPS – deshalb gehört sie zu den Hauptaussagen
  const thr = throttleShares(st);
  if (thr.cpuTemp >= 0.05) add(main, "bad", `Die CPU drosselte ${pct(thr.cpuTemp)} der Zeit wegen Temperatur – Kühler, Lüfterkurve und Wärmeleitpaste prüfen.`);
  else if (thr.cpu >= 0.05) add(main, "warn", `Die CPU wurde ${pct(thr.cpu)} der Zeit gedrosselt (Strom- oder Leistungslimit) – der Grund steht in den Meldungen.`);
  if (thr.gpu >= 0.1) add(main, "bad", `Die Grafikkarte drosselte ${pct(thr.gpu)} der Zeit wegen Temperatur – Kühlung, Staub und Lüfterkurve prüfen.`);

  // Gleichmäßigkeit: 1%-Low im Verhältnis zur Ø-FPS – wichtiger fürs Spielgefühl als die Ø-FPS selbst
  if (st.fps && st.low1) {
    const r = st.low1 / st.fps;
    if (r >= 0.8) add(main, "good", `Gleichmäßige Bildausgabe: das 1%-Low liegt bei ${pct(r)} der Ø-FPS.`);
    else if (r >= 0.65) add(main, "info", `Leichte Schwankungen: das 1%-Low liegt bei ${pct(r)} der Ø-FPS.`);
    else add(main, "warn", `Ungleichmäßige Bildausgabe: das 1%-Low liegt nur bei ${pct(r)} der Ø-FPS – Details unter „Bild und Ruckler“.`);
  }

  if (st.spikesPerMin > 10) add(main, "warn", `Häufige Ruckler: ${fmt(st.spikesPerMin, 1)} pro Minute – die Meldungen nennen die vermutete Ursache.`);
  else if (st.spikesPerMin > 2) add(main, "info", `Gelegentliche Ruckler: ${fmt(st.spikesPerMin, 1)} pro Minute.`);
  else if (st.duration) add(main, "good", `Kaum Ruckler: ${fmt(st.spikesPerMin, 1)} pro Minute.`);

  if (st.pacing !== null && pacingRating(st.pacing, st.ft) === "unruhig")
    add(main, "warn", `Unruhiges Frame-Pacing (±${fmt(st.pacing, 1)} ms von Bild zu Bild) – FPS-Limit, VSync und G-Sync/FreeSync prüfen.`);
  if (noteShare(st, /VRAM voll/) > 0) add(main, "warn", "Der Grafikspeicher lief voll – Texturdetails oder Auflösung senken.");
  if (slowTimer(s)) add(main, "warn", `Windows nutzte einen langsamen Zeitgeber: ${slowTimer(s)}. Spiele fragen die Zeit sehr oft ab – das kostet FPS.`);
  // Leistung im Lauf der Sitzung – Hauptaussage nur, wenn Speicher oder Temperaturen den Abfall erklären
  const tr = st.trend;
  const lk = st.leak;
  const leakText = lk ? `um etwa ${fmt(lk.rate, 0)} MB pro Minute seit Minute ${lk.sinceMinute}, erkannt in Minute ${lk.atMinute}` : "";
  if (tr && tr.decline) {
    const what = `im letzten Drittel Ø ${fmt(tr.last.fps, 0)} statt ${fmt(tr.first.fps, 0)} FPS`
      + (tr.last.spikesPerMin >= 2 * tr.first.spikesPerMin && tr.last.spikesPerMin > 2 ? `, ${fmt(tr.last.spikesPerMin, 1)} statt ${fmt(tr.first.spikesPerMin, 1)} Ruckler pro Minute` : "");
    if (tr.leak)
      add(main, "warn", `Die Leistung sank im Lauf der Sitzung (${what}), während der Speicher des Spiels stetig wuchs (${leakText}) – `
        + "deutet auf ein Speicherleck im Spiel; ein Neustart des Spiels hilft vorübergehend.");
    else if (tr.warmer)
      add(main, "warn", `Die Leistung sank im Lauf der Sitzung (${what}), während die Temperaturen stiegen – Kühlung und Luftstrom prüfen.`);
    else add(side, "info", `Im Lauf der Sitzung sank die Leistung (${what}) – kann auch an anderen Spielszenen liegen.`);
  } else if (lk)
    add(side, "warn", `Der Speicher des Spiels wuchs stetig (${leakText}) – mögliches Speicherleck, die Leistung blieb aber stabil.`);

  const dead = st.deadEffect;
  if (deadConnectionsHurt(st))
    add(main, "warn", `Tote Verbindungen bremsten das Spiel: Mit ${DEAD_THRESHOLD} oder mehr toten Verbindungen gab es ${fmt(dead.spikesHigh, 1)} Ruckler pro Minute bei Ø ${fmt(dead.fpsHigh, 0)} FPS, `
      + `ohne sie ${fmt(dead.spikesLow, 1)} pro Minute bei Ø ${fmt(dead.fpsLow, 0)} FPS. Das Spiel schließt vom Server beendete Verbindungen nicht – `
      + "ein Fehler im Spiel; ein Neustart hilft vorübergehend. Details unter „Verbindung“.");
  if (st.fpsApp && st.fps && st.fpsApp < st.fps * 0.8) add(main, "info", `Frame Generation war aktiv: ${fmt(st.fps, 0)} FPS angezeigt, ${fmt(st.fpsApp, 0)} vom Spiel gerendert.`);

  // Nebenbefunde: Temperaturen ohne Drosselung und die Verbindung
  if (thr.cpuTemp < 0.05 && st.cpuTempMax !== null && st.cpuTempMax >= 95)
    add(side, "warn", `Die CPU erreicht ${fmt(st.cpuTempMax, 0)} °C – nahe an der Maximaltemperatur vieler Prozessoren; Kühlung im Blick behalten.`);
  if (thr.gpu < 0.1 && st.gpuTempMax !== null && st.gpuTempMax >= 83)
    add(side, "info", `Die Grafikkarte wird bis ${fmt(st.gpuTempMax, 0)} °C warm – nahe an der üblichen Drosselgrenze.`);
  if (st.memTempMax !== null && st.memTempMax >= 100)
    add(side, "warn", `Der Grafikspeicher erreicht ${fmt(st.memTempMax, 0)} °C – deutet auf gealterte Wärmeleitpads oder wenig Luftstrom hin.`);
  if (st.pingNet !== null) {
    if ((st.lossNetMax || 0) >= 3 || (st.jitterNet || 0) >= 15)
      add(side, "warn", `Die Verbindung schwankte (Ping ${fmt(st.pingNet, 0)} ms ±${fmt(st.jitterNet, 0)}, Verlust bis ${fmt(st.lossNetMax, 0)} %) – Details unter „Verbindung“.`);
    // Bufferbloat hat eine eigene Aussage – "stabil" wäre daneben widersprüchlich
    else if (!(st.pingLoad && st.pingLoad.rise >= 30))
      add(side, "good", `Stabile Verbindung: ${fmt(st.pingNet, 0)} ms ±${fmt(st.jitterNet, 0)}, kein nennenswerter Verlust.`);
  }
  if (st.pingLoad && st.pingLoad.rise >= 30)
    add(side, "warn", `Bufferbloat: Bei Download oder Upload stieg der Ping von ${fmt(st.pingLoad.without, 0)} auf ${fmt(st.pingLoad.withLoad, 0)} ms – `
      + "im Router QoS bzw. SQM aktivieren oder Downloads während des Spielens begrenzen.");
  if (st.commitMax !== null && st.commitMax >= 90)
    add(side, "warn", `Die Speicherzusage erreichte ${fmt(st.commitMax, 0)} % – große Programme vor dem Spielen schließen `
      + "(die Meldungen nennen den größten Verbraucher) oder die Auslagerungsdatei vergrößern.");
  const dpc = st.dpc;
  if (dpc && dpc.hurts)
    add(side, "warn", `Treiber belegten zeitweise einen Prozessorkern stark (bis ${fmt(st.dpcMax, 0)} %), und genau dann ruckelte es häufiger `
      + `(in ${pct(dpc.quoteHigh)} statt ${pct(dpc.quoteLow)} der Sekunden) – häufige Verursacher sind Netzwerk-, Audio-, USB- und RGB-Treiber; `
      + "aktuelle Treiber installieren.");
  else if (dpc && dpc.base >= DPC.infoBase)
    add(side, "info", `Treiberlast im Spiel hoch (üblich ${fmt(dpc.base, 0)} % eines Kerns), aber ohne Einfluss auf Ruckler.`);
  if (!deadConnectionsHurt(st) && dead && dead.highSec > 0)
    add(side, "info", `Das Spiel hielt zeitweise bis zu ${fmt(st.deadMax, 0)} tote Verbindungen offen (vom Server geschlossen, vom Spiel nicht) – `
      + (dead.comparable ? "ohne messbaren Einfluss auf Ruckler und FPS." : "für einen Vergleich mit den Rucklern war die Sitzung zu kurz."));
  if ((st.cpuTempMax !== null || st.gpuTempMax !== null) && !(tr && tr.decline && tr.warmer) && thr.cpu < 0.05 && thr.gpu < 0.1 && !side.some(x => x.level === "warn" || x.level === "info"))
    side.unshift({ level: "good", text: "Temperaturen unauffällig." });

  // Engpass bleibt vorn, der Rest nach Dringlichkeit
  const [first, ...rest] = main;
  const byLevel = (a, b) => LEVEL_ORDER[a.level] - LEVEL_ORDER[b.level];
  return { main: first ? [first, ...rest.sort(byLevel)] : [], side: side.sort(byLevel) };
}

function insightList(items, hint) {
  return `<ul class="insights">${items.map(x => `<li class="lv-${x.level}"><span class="ico">${LEVEL_ICON[x.level]}</span><span>${esc(x.text)}</span></li>`).join("")}</ul>`
    + (hint ? `<p class="insights-hint">${esc(hint)}</p>` : "");
}

/** Wie FrameMetrics.PacingRating im Overlay: unter 10 % der Frametime ruhig, ab 25 % unruhig */
function pacingRating(pacing, ft) {
  if (pacing === null || !ft) return "";
  if (pacing < 1) return "ruhig";   // unter 1 ms nicht wahrnehmbar (Menüs mit sehr hohen FPS)
  const r = pacing / ft;
  return r < 0.10 ? "ruhig" : r < 0.25 ? "leicht unruhig" : "unruhig";
}

function card(k, v, sub) {
  return `<div class="card"><div class="k">${k}</div><div class="v">${v}</div><div class="k">${sub || "&nbsp;"}</div></div>`;
}

// ---------------------------------------------------------------- Vergleich

const METRICS = [
  ["Dauer", s => s.duration, v => clock(v), 0],
  // "pp": Abweichung in Prozentpunkten statt relativ – 30 % → 80 % ist "+50 Pkt.", nicht "+167 %"
  ["Anteil GPU-Limit", s => s.shares.Gpu || 0, pct, 0, "pp"],
  ["Anteil CPU-Limit", s => s.shares.Cpu || 0, pct, -1, "pp"],
  ["Ø FPS", s => s.fps, v => fmt(v, 1), 1],
  ["Ø 1%-Low", s => s.low1, v => fmt(v, 1), 1],
  ["Ø FPS im CPU-Limit", s => s.fpsCpu, v => fmt(v, 1), 1],
  ["Ø Frametime", s => s.ft, v => fmt(v, 2, " ms"), -1],
  ["Ruckler pro Minute", s => s.spikesPerMin, v => fmt(v, 1), -1],
  ["Ø Frame-Pacing", s => s.pacing, v => "±" + fmt(v, 2, " ms"), -1],
  ["Ø CPU-Arbeitszeit", s => s.cpuBusy, v => fmt(v, 2, " ms"), -1],
  ["Ø GPU-Arbeitszeit", s => s.gpuBusy, v => fmt(v, 2, " ms"), 0],
  ["Ø Hauptthread", s => s.thread, v => fmt(v, 0, " %"), 0],
  ["CPU-Temperatur max", s => s.cpuTempMax, v => fmt(v, 0, " °C"), -1],
  ["GPU-Temperatur max", s => s.gpuTempMax, v => fmt(v, 0, " °C"), -1],
  ["GPU-Hotspot max", s => s.hotspotMax, v => fmt(v, 0, " °C"), -1],
  ["GPU-Speicher max", s => s.memTempMax, v => fmt(v, 0, " °C"), -1],
  ["Ø GPU-Takt unter Last", s => s.gpuMhzLoad, v => fmt(v, 0, " MHz"), 1],
  ["Ø GPU-Spannung unter Last", s => s.gpuVLoad, v => fmt(v, 3, " V"), 0],
  ["Ø GPU-Leistung unter Last", s => s.gpuWLoad, v => fmt(v, 0, " W"), 0],
  ["Ø Ping Internet", s => s.pingNet, v => fmt(v, 0, " ms"), -1],
  ["Ø Jitter Internet", s => s.jitterNet, v => "±" + fmt(v, 1, " ms"), -1],
  ["Paketverlust max", s => s.lossNetMax, v => fmt(v, 0, " %"), -1],
  ["Ø CPU-Lüfter", s => s.cpuFan, v => fmt(v, 0, " U/min"), -1],
  ["Ø GPU-Lüfter unter Last", s => s.gpuFanLoad, v => fmt(v, 0, " %"), -1],
  ["Ø CPU-Leistung", s => s.cpuW, v => fmt(v, 0, " W"), 0],
  ["Ø GPU-Leistung", s => s.gpuW, v => fmt(v, 0, " W"), 0],
];

/** Einordnung jeder weiteren Sitzung gegenüber der ersten: Bildrate, Gleichmäßigkeit, Ruckler, Temperaturen */
function comparisonInsights() {
  const ref = sessions[0], r = ref.stats, out = [];
  const game = s => (s.meta["Spiel"] || s.name).toLowerCase();
  if (sessions.some(s => game(s) !== game(ref)))
    out.push({ level: "warn", text: "Die Sitzungen stammen aus verschiedenen Spielen – die Zahlen lassen sich nicht direkt vergleichen." });

  const rel = (a, b) => (a !== null && b) ? (a - b) / Math.abs(b) * 100 : null;
  const share = (st, k) => (st.shares[k] || 0) / Math.max(0.01, 1 - (st.shares.None || 0));
  for (const s of sessions.slice(1)) {
    // Zuerst: Hat sich der Engpass verschoben? Ab 5 Prozentpunkten zählt das als Veränderung
    const shifts = [["CPU-Limit", "Cpu"], ["GPU-Limit", "Gpu"], ["FPS-Limit", "Limit"]]
      .map(([label, k]) => [label, share(r, k), share(s.stats, k)])
      .filter(([, a, b]) => Math.abs(b - a) >= 0.05);
    out.push({
      level: "info",
      text: shifts.length
        ? `${sessionLabel(s)}: Engpass verschoben – ${shifts.map(([label, a, b]) => `${label} ${pct(a)} → ${pct(b)}`).join(", ")}.`
        : `${sessionLabel(s)}: Engpass unverändert (überwiegend ${KINDS[s.stats.top?.[0]]?.short ?? "–"}).`,
    });

    const st = s.stats, parts = [];
    let score = 0;
    const judge = (label, p, higherIsBetter, unit = " %") => {
      if (p === null || Math.abs(p) < 2) return;
      const better = (p > 0) === higherIsBetter;
      score += better ? 1 : -1;
      parts.push(`${label} ${p > 0 ? "+" : ""}${fmt(p, 0)}${unit}`);
    };
    judge("Ø FPS", rel(st.fps, r.fps), true);
    judge("1%-Low", rel(st.low1, r.low1), true);
    if (r.spikesPerMin + st.spikesPerMin >= 1) judge("Ruckler", rel(st.spikesPerMin, Math.max(r.spikesPerMin, 0.1)), false);

    const dT = (a, b) => (a !== null && b !== null) ? a - b : null;
    for (const [label, d] of [["GPU", dT(st.gpuTempMax, r.gpuTempMax)], ["GPU-Speicher", dT(st.memTempMax, r.memTempMax)], ["CPU", dT(st.cpuTempMax, r.cpuTempMax)]]) {
      if (d === null || Math.abs(d) < 3) continue;
      score += d < 0 ? 1 : -1;
      parts.push(`${label} ${d > 0 ? "+" : "−"}${fmt(Math.abs(d), 0)} °C`);
    }

    const verdict = !parts.length ? "praktisch gleich (Abweichungen unter Messrauschen)"
      : score > 0 ? "insgesamt besser" : score < 0 ? "insgesamt schlechter" : "gemischt";
    out.push({
      level: !parts.length ? "info" : score > 0 ? "good" : score < 0 ? "warn" : "info",
      text: `${sessionLabel(s)}: ${verdict}${parts.length ? " – " + parts.join(", ") : ""}.`,
    });
  }
  return out;
}

function renderComparison(view) {
  const ref = sessions[0];
  const glance = section(view, "Auf einen Blick", `gegenüber ${sessionLabel(ref)}`, { id: "cmp-glance", open: true, help: HELP.glance });
  glance.insertAdjacentHTML("beforeend", insightList(comparisonInsights(),
    "Verglichen werden Engpass, Bildrate, Gleichmäßigkeit, Ruckler und Höchsttemperaturen; unter 5 Prozentpunkten, 2 % bzw. 3 °C gilt als gleich."));

  const bn = section(view, "Engpass je Sitzung", "", { id: "cmp-bottleneck", open: true, help: HELP.result });
  sessions.forEach(s => bn.insertAdjacentHTML("beforeend", `<div style="margin-top:8px;font-size:13px"><span class="swatch" style="background:${s.color}"></span>${esc(sessionLabel(s))}</div>${shareBar(s.stats.shares)}`));

  const sec = section(view, "Vergleich", `Referenz: ${sessionLabel(ref)} – Abweichungen in % zur Referenz`, { id: "cmp-table", open: true, help: HELP.compare });
  const head = sessions.map(s => `<th><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:6px"></span>${esc(sessionLabel(s))}</th>`).join("");
  const body = METRICS.map(([label, get, show, dir, mode]) => {
    const base = get(ref.stats);
    return `<tr><td>${label}</td>${sessions.map((s, i) => {
      const v = get(s.stats);
      let delta = "";
      if (i > 0 && v !== null && mode === "pp" && base !== null) {
        const p = (v - base) * 100;
        const cls = Math.abs(p) < 5 || dir === 0 ? "same" : (p > 0) === (dir > 0) ? "better" : "worse";
        delta = `<span class="d ${cls}">${p > 0 ? "+" : ""}${fmt(p, 0)} Pkt.</span>`;
      } else if (i > 0 && v !== null && base) {
        const p = (v - base) / Math.abs(base) * 100;
        const cls = Math.abs(p) < 2 || dir === 0 ? "same" : (p > 0) === (dir > 0) ? "better" : "worse";
        delta = `<span class="d ${cls}">${p > 0 ? "+" : ""}${fmt(p, 1)} %</span>`;
      }
      return `<td>${v === null ? "–" : show(v)}${delta}</td>`;
    }).join("")}</tr>`;
  }).join("");
  sec.insertAdjacentHTML("beforeend", `<table><thead><tr><th></th>${head}</tr></thead><tbody>${body}</tbody></table>`);

  const ch = section(view, "FPS im Vergleich", "Zeitachse ab Sitzungsbeginn", { id: "cmp-fps", open: true, help: HELP.frames });
  compareChart(ch);
}

// ---------------------------------------------------------------- Diagramme (SVG, ohne Bibliothek)

const charts = [];

/** Legendenlinie im selben Strichmuster wie die Kurve im Diagramm */
function swatch(x) {
  return `<svg class="swatch-line" width="16" height="6" aria-hidden="true"><line x1="0" x2="16" y1="3" y2="3" stroke="${x.color}" stroke-width="2"${x.dash ? ` stroke-dasharray="${x.dash}"` : ""}/></svg>`;
}
const H = 150, PAD = { l: 38, r: 8, t: 8, b: 20 };

function chart(parent, s, title, series, opt = {}) {
  const wrap = document.createElement("div");
  wrap.className = "chart";
  wrap.innerHTML = `<div class="title"><b>${title}</b>${series.map(x => `<span>${swatch(x)}${x.label}</span>`).join("")}</div>`;
  parent.append(wrap);
  const c = { wrap, sessions: [s], series, opt, single: true };
  charts.push(c);
  draw(c);
}

function compareChart(parent) {
  const wrap = document.createElement("div");
  wrap.className = "chart";
  wrap.innerHTML = `<div class="title">${sessions.map(s => `<span><span class="swatch" style="background:${s.color}"></span>${esc(sessionLabel(s))}</span>`).join("")}</div>`;
  parent.append(wrap);
  const c = { wrap, sessions: [...sessions], series: [{ key: "fps", label: "FPS" }], opt: { min: 0 }, single: false };
  charts.push(c);
  draw(c);
}

/** Sichtbarer Zeitausschnitt in Sekunden ab Sitzungsbeginn – gilt für alle Diagramme der Ansicht; null = gesamte Sitzung */
let zoom = null;
let drag = null;   // laufende Auswahl: { c, x0 }

function setZoom(z) {
  zoom = z;
  charts.forEach(draw);
}

function draw(c) {
  c.wrap.querySelector("svg.plot")?.remove();
  const W = Math.max(300, c.wrap.clientWidth);
  const iw = W - PAD.l - PAD.r, ih = H - PAD.t - PAD.b - (c.opt.strip ? 8 : 0);

  let tMax = 0;
  for (const s of c.sessions) tMax = Math.max(tMax, s.d.t[s.d.t.length - 1] - s.d.t[0]);
  tMax = Math.max(tMax, 1);
  const ta = zoom ? Math.min(zoom.a, tMax) : 0;
  const span = Math.max(1, (zoom ? Math.min(zoom.b, tMax) : tMax) - ta);
  const inRange = t => t >= ta && t <= ta + span;
  const X = t => PAD.l + (t - ta) / span * iw;

  // Sichtbare Punkte je Sitzung und Linie: [t, v]
  const visible = (s, key) => {
    const t0 = s.d.t[0], out = [];
    s.d[key].forEach((v, i) => { const t = s.d.t[i] - t0; if (v !== null && inRange(t)) out.push([t, v]); });
    return out;
  };

  // Wertebereich über alle sichtbaren Werte. Oben zählt das 99. Perzentil: Einzelne Ausreißer (z. B. ein
  // 90-ms-Frame beim Laden) würden sonst den ganzen Verlauf flach an den Boden drücken – sie werden abgeschnitten.
  let lo = c.opt.min ?? Infinity, hi = c.opt.max ?? -Infinity;
  const all = [];
  for (const s of c.sessions) for (const x of c.series) for (const [, v] of visible(s, x.key)) {
    if (c.opt.min === undefined) lo = Math.min(lo, v);
    all.push(v);
  }
  if (c.opt.max === undefined && all.length) {
    all.sort((a, b) => a - b);
    hi = all[Math.min(all.length - 1, Math.floor(all.length * 0.99))];
  }
  if (!Number.isFinite(lo) || !Number.isFinite(hi)) { lo = 0; hi = 1; }
  if (c.opt.min === undefined) lo = Math.floor(lo * 0.9);
  if (c.opt.max === undefined) hi = niceMax(hi * 1.05);
  if (hi <= lo) hi = lo + 1;

  const Y = v => PAD.t + ih - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * ih;
  let svg = `<svg class="plot" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`;

  // Raster und Beschriftung
  svg += `<g class="grid">`;
  for (let i = 0; i <= 4; i++) {
    const v = lo + (hi - lo) * i / 4, y = Y(v);
    svg += `<line x1="${PAD.l}" x2="${W - PAD.r}" y1="${y}" y2="${y}"/><text x="${PAD.l - 6}" y="${y + 4}" text-anchor="end">${fmt(v, hi - lo < 10 ? 1 : 0)}</text>`;
  }
  for (let i = 0; i <= 5; i++) {
    const t = ta + span * i / 5;
    svg += `<text x="${X(t)}" y="${H - 4}" text-anchor="${i === 0 ? "start" : i === 5 ? "end" : "middle"}">${clock(t)}</text>`;
  }
  svg += `</g>`;

  // Engpass-Streifen unter dem Diagramm – bei mehr Messpunkten als Pixeln je Pixel der häufigste Engpass
  if (c.opt.strip) {
    const s = c.sessions[0], t0 = s.d.t[0], y = PAD.t + ih + 3;
    const idx = s.d.t.map((t, i) => i).filter(i => inRange(s.d.t[i] - t0));
    if (idx.length <= iw) {
      for (const i of idx) {
        const x1 = X(s.d.t[i] - t0), x2 = Math.min(PAD.l + iw, X(s.d.t[i] - t0 + 1));
        svg += `<rect x="${x1}" y="${y}" width="${Math.max(0.6, x2 - x1)}" height="5" fill="${(KINDS[s.d.kind[i]] || KINDS.None).color}"/>`;
      }
    } else {
      const px = new Map();
      for (const i of idx) {
        const p = Math.min(iw - 1, Math.floor(X(s.d.t[i] - t0) - PAD.l));
        const counts = px.get(p) || {};
        counts[s.d.kind[i]] = (counts[s.d.kind[i]] || 0) + 1;
        px.set(p, counts);
      }
      for (const [p, counts] of px) {
        const k = Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
        svg += `<rect x="${PAD.l + p}" y="${y}" width="1" height="5" fill="${(KINDS[k] || KINDS.None).color}"/>`;
      }
    }
  }

  // Ruckler als rote Markierungen
  if (c.opt.markers) {
    const s = c.sessions[0], t0 = s.d.t[0];
    s.d.spikes.forEach((n, i) => {
      const t = s.d.t[i] - t0;
      if (n > 0 && inRange(t)) svg += `<line x1="${X(t)}" x2="${X(t)}" y1="${PAD.t}" y2="${PAD.t + ih}" stroke="var(--bad)" stroke-opacity=".45"/>`;
    });
  }

  // Linien – Lücken (Pause, Alt+Tab) über 3 s werden nicht verbunden. Liegen mehr Messpunkte als Pixel im
  // Ausschnitt (lange Sitzungen), wird je Pixelspalte zusammengefasst: Mittelwert als Linie, Minimum bis
  // Maximum als blasses Band – sonst springt die Linie innerhalb einer Spalte hin und her und wird zur Fläche.
  for (const s of c.sessions) {
    for (const x of c.series) {
      const color = c.single ? x.color : s.color;
      const pts = visible(s, x.key);
      const style = `fill="none" stroke="${color}" stroke-width="1.5" ${x.dash ? `stroke-dasharray="${x.dash}"` : ""} stroke-linejoin="round"`;
      if (pts.length <= iw * 1.5) {
        let d = "", prevT = null;
        for (const [t, v] of pts) {
          d += (prevT === null || t - prevT > 3 ? "M" : "L") + X(t).toFixed(1) + "," + Y(v).toFixed(1);
          prevT = t;
        }
        svg += `<path d="${d}" ${style}/>`;
        continue;
      }

      const buckets = [];
      for (const [t, v] of pts) {
        const p = Math.min(iw - 1, Math.floor(X(t) - PAD.l));
        const b = buckets[buckets.length - 1];
        if (b && b.p === p) { b.sum += v; b.n++; b.min = Math.min(b.min, v); b.max = Math.max(b.max, v); b.t1 = t; }
        else buckets.push({ p, sum: v, n: 1, min: v, max: v, t0: t, t1: t });
      }
      // Zusammenhängende Abschnitte (ohne Lücke über 3 s)
      const segments = [];
      for (const b of buckets) {
        const seg = segments[segments.length - 1], prev = seg?.[seg.length - 1];
        if (!prev || b.t0 - prev.t1 > 3) segments.push([b]); else seg.push(b);
      }
      const bx = b => (PAD.l + b.p + 0.5).toFixed(1);
      let band = "", line = "";
      for (const seg of segments) {
        band += "M" + seg.map(b => bx(b) + "," + Y(b.max).toFixed(1)).join("L")
          + "L" + seg.slice().reverse().map(b => bx(b) + "," + Y(b.min).toFixed(1)).join("L") + "Z";
        line += "M" + seg.map(b => bx(b) + "," + Y(b.sum / b.n).toFixed(1)).join("L");
      }
      // Gestrichelte Hilfslinien (Frametime, 1%-Low …) ohne Band – das würde sonst unübersichtlich
      if (!x.dash) svg += `<path d="${band}" fill="${color}" fill-opacity=".16" stroke="none"/>`;
      svg += `<path d="${line}" ${style}/>`;
    }
  }
  svg += `<rect class="sel" x="0" y="${PAD.t}" width="0" height="${ih}" fill="var(--limit)" fill-opacity=".18" visibility="hidden"/>`;
  svg += `<line class="cross" x1="0" x2="0" y1="${PAD.t}" y2="${PAD.t + ih}" stroke="var(--muted)" stroke-dasharray="2 3" visibility="hidden"/>`;
  svg += `<rect x="${PAD.l}" y="${PAD.t}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
  c.wrap.insertAdjacentHTML("beforeend", svg);

  // Hinweis auf den Ausschnitt in der Titelzeile
  const title = c.wrap.querySelector(".title");
  let info = title.querySelector(".zoom");
  if (!info) {
    info = document.createElement("span");
    info.className = "zoom";
    info.onclick = () => setZoom(null);
    title.append(info);
  }
  info.style.display = zoom ? "" : "none";
  info.textContent = zoom ? `Ausschnitt ${clock(ta)}–${clock(ta + span)} · Gesamt anzeigen` : "";

  const el = c.wrap.querySelector("svg.plot");
  Object.assign(c, { X, ta, span, iw });
  el.onmousemove = ev => { hover(c, ev); if (drag?.c === c) showSelection(c, ev); };
  el.onmouseleave = () => { document.getElementById("tip").style.display = "none"; charts.forEach(k => k.wrap.querySelector(".cross")?.setAttribute("visibility", "hidden")); };
  el.onmousedown = ev => {
    if (ev.button !== 0) return;
    ev.preventDefault();   // keine Textmarkierung beim Ziehen
    drag = { c, x0: svgX(el, ev) };
  };
  el.ondblclick = () => setZoom(null);
}

const svgX = (el, ev) => ev.clientX - el.getBoundingClientRect().left;
const timeAt = (c, x) => c.ta + Math.min(1, Math.max(0, (x - PAD.l) / c.iw)) * c.span;

function showSelection(c, ev) {
  const el = c.wrap.querySelector("svg.plot"), sel = el.querySelector(".sel");
  const clamp = x => Math.min(PAD.l + c.iw, Math.max(PAD.l, x));
  const a = clamp(drag.x0), b = clamp(svgX(el, ev));
  sel.setAttribute("x", Math.min(a, b));
  sel.setAttribute("width", Math.abs(b - a));
  sel.setAttribute("visibility", "visible");
}

// Auswahl beenden – auch wenn die Maus beim Loslassen außerhalb des Diagramms ist
document.addEventListener("mouseup", ev => {
  if (!drag) return;
  const { c, x0 } = drag;
  drag = null;
  const el = c.wrap.querySelector("svg.plot");
  el.querySelector(".sel")?.setAttribute("visibility", "hidden");
  const x1 = svgX(el, ev);
  if (Math.abs(x1 - x0) < 6) return;   // einfacher Klick, kein Ziehen
  let a = timeAt(c, Math.min(x0, x1)), b = timeAt(c, Math.max(x0, x1));
  if (b - a < 10) { const m = (a + b) / 2; a = Math.max(0, m - 5); b = a + 10; }   // mindestens 10 s
  setZoom({ a, b });
});

function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  return [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].map(f => f * p).find(f => f >= v);
}

/** Fadenkreuz in allen Diagrammen synchron, Werte im Tooltip */
function hover(c, ev) {
  const t = timeAt(c, svgX(ev.currentTarget, ev));
  for (const k of charts) {
    const cross = k.wrap.querySelector(".cross");
    if (!cross) continue;
    const inside = t >= k.ta && t <= k.ta + k.span;
    const x = k.X(t);
    cross.setAttribute("x1", x); cross.setAttribute("x2", x); cross.setAttribute("visibility", inside ? "visible" : "hidden");
  }
  let html = `<b>${clock(t)}</b>`;
  for (const s of c.sessions) {
    const t0 = s.d.t[0];
    let i = 0, best = Infinity;
    s.d.t.forEach((v, j) => { const dist = Math.abs(v - t0 - t); if (dist < best) { best = dist; i = j; } });
    if (best > 2) continue;
    if (c.single) {
      html += c.series.map(x => `<br>${swatch(x)}${x.label}: ${fmt(s.d[x.key][i], 1)}${c.opt.unit || ""}`).join("");
      html += `<br><span style="color:var(--muted)">${esc(s.d.title[i] || "")}</span>`;
    } else {
      html += `<br><span class="swatch" style="background:${s.color}"></span>${esc(sessionLabel(s))}: ${fmt(s.d.fps[i], 0)} FPS`;
    }
  }
  const tip = document.getElementById("tip");
  tip.innerHTML = html;
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - tw - 8, ev.clientX + 14) + "px";
  tip.style.top = (ev.clientY + 14) + "px";
}

let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => charts.forEach(draw), 120); });
</script>
</body>
</html>
